name: pipeline

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  # Refreshes the imported-by badge weekly. pkg.go.dev's crawl lags
  # publication by days, so a daily run would re-derive an unchanged number.
  # The whole pipeline runs, not only the badges job, because the badge
  # publisher republishes only what the run produced and needs the coverage
  # artifact. The slot comes from a hash of the repo name, so it avoids the
  # round numbers where the scheduler sheds queued runs.
  schedule:
    - cron: "29 20 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  code:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    permissions:
      actions: read
      contents: read
      security-events: write # for the sec SARIF upload
    uses: psyb0t/reusable-github-workflows/.github/workflows/code-workflow.yml@master
    with:
      lint_command: "make lint"
      test_command: "make test-coverage test-browser test-execution-forms test-installer"
      sec_command: "make sec"
      generate_command: "make generate"
      coverage_file: "coverage-percent.txt"
      sarif_file: "sec.sarif"
      sarif_category: "go"

  # Images are built only for real pushes and pull requests. The weekly badge
  # refresh and manual runs must not republish an image.
  docker:
    needs: [code]
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    permissions:
      contents: write
      security-events: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/docker-image-workflow.yml@master
    with:
      repository_name: psyb0t/peen
      target_platforms: "linux/amd64,linux/arm64"
      # The controller names its default worker image psyb0t/peen:<build
      # version>, so the image must carry the tag it is published under: the
      # release tag on a tag push, latest on main. Without it every published
      # image reports "dev" and its Docker workers name a missing image.
      build_targets: '[{"build_args":"BUILD_VERSION=${{ startsWith(github.ref, ''refs/tags/'') && github.ref_name || ''latest'' }}\nBUILD_COMMIT=${{ github.sha }}"}]'
      scan_severity: "high"
      scan_fail_build: false
      dockerhub_private: false
      sync_description: true
    secrets:
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  badges:
    needs: [code]
    if: github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/create-badges.yml@master
    with:
      coverage: true
      importers: true

  release:
    needs: [code]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/release-workflow.yml@master

  # Publish the peen skill to ClawHub. Tag pushes ONLY, after the image build
  # so the advertised skill always has a published image behind it. Only the
  # peen skill is published: .agents/skills/ also holds the Servicepack
  # framework's own skill, which is not Peen's to publish. No plugins.
  publish-to-clawhub:
    needs: [docker]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    uses: psyb0t/reusable-github-workflows/.github/workflows/clawhub-publish.yml@master
    with:
      skill_names: '["peen"]'
      plugin_names: "[]"
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
