version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - err113
    - mnd
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - containedctx
    - contextcheck
    - cyclop
    - decorder
    - depguard
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - forbidigo
    - forcetypeassert
    - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - gosmopolitan
    - grouper
    - importas
    - interfacebloat
    - ireturn
    - lll
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnil
    - nlreturn
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - prealloc
    - predeclared
    - promlinter
    - reassign
    - revive
    - rowserrcheck
    - sqlclosecheck
    - tagalign
    - tagliatelle
    - testableexamples
    # - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
    - zerologlint

  settings:
    lll:
      line-length: 80
      tab-width: 4
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
    depguard:
      rules:
        main:
          allow:
            - $gostd
            - github.com/stretchr/testify/
            - github.com/pkg/errors
            - github.com/spf13/viper
            - github.com/sirupsen/logrus
            - github.com/google/uuid
            - github.com/getkin/kin-openapi
            - github.com/glebarez/sqlite
            - github.com/gorilla/websocket
            - github.com/moby/moby
            - github.com/prometheus/client_golang
            - github.com/prometheus/client_model
            - github.com/prometheus/common
            - github.com/psyb0t
            - github.com/joho/godotenv
            - github.com/spf13/cobra
            # Integration-test harness under tests/ that builds and runs the app
            # image via testcontainers-go. Test-only; production never imports it.
            - github.com/testcontainers/testcontainers-go
            - golang.org/x/sys
            - gorm.io/gen
            - gorm.io/gorm

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
    paths:
      - third_party$
      - builtin$
      - examples$
    rules:
      # Test fixtures intentionally repeat exact protocol and filesystem values.
      # Keep production code under the full baseline while avoiding fake
      # constants or altered fixture bytes solely for style checks.
      - path: _test\.go
        linters:
          - cyclop
          - dupl
          - dupword
          - funlen
          - gocognit
          - goconst
          - lll
          - maintidx
          - wrapcheck
          - wsl_v5

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
