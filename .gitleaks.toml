title = "servicepack secret scanning"

[extend]
useDefault = true

# gitleaks `dir` mode scans the WORKING TREE and does NOT honour .gitignore, so
# every gitignored path has to be named again here or the gate drowns in
# findings from files that will never be committed, and a drowned gate is one
# people learn to skip.
#
# Every entry below was verified untracked with `git ls-files --error-unmatch`
# before being added. Allowlisting a path that IS committed would silence a real
# leak permanently.
#
# Allowlisting is by PATH only, never by regex on the matched text: a pattern
# like `test_secret` suppresses any finding whose text happens to contain it,
# including a genuine credential in a file that merely looks like a fixture.
[[allowlists]]
description = "Gitignored local state and build output"
paths = [
  '''(^|/)\.env$''',
  '''(^|/)\.telemetry(?:/|$)''',
  '''(^|/)build(?:/|$)''',
  '''(^|/)coverage-percent\.txt$''',
  '''(^|/)git-update\.sh$''',
  '''(^|/)CLAUDE\.md$''',
]

# The one tracked exception. This vendored file is SQLite transpiled to Go, and
# its Windows API constants such as BCRYPT_AES_WRAP_KEY_BLOB match the
# generic-api-key rule. It holds no credentials and is replaced only by a
# modernc.org/sqlite version bump.
[[allowlists]]
description = "Vendored SQLite translation with Windows API constant names"
paths = [
  '''(^|/)vendor/modernc\.org/sqlite/lib/sqlite_g_0000000000060000\.go$''',
]
