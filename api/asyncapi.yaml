          $ref: "#/components/schemas/AgentRunQuestionData"
        timestamp:
          type: integer
          format: int64
          description: >-
            When Peen stored the child event, in Unix seconds. It is the same
            live and on replay, so it does not tell you which path delivered
            the frame.
