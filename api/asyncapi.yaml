      title: AgentRunToolCall
      type: object
      additionalProperties: false
      required: [id, name, arguments]
      description: >-
        One tool call a child's assistant message requested, inside `toolCalls`
        of an `agent.run.assistant.message` frame.
      properties:
        id:
          type: string
          description: >-
            The call ID the provider assigned. The run's `agent.run.tool.use`
            and `agent.run.tool.result` for this call carry it as `callId`.
        name:
          type: string
          description: The name of the tool the model called.
        arguments:
          title: AgentRunToolCallArguments
          type: [object, 'null']
          description: >-
            Open. The tool's own arguments, shaped by that tool, exactly as the
            provider returned them; null when the provider sent none.

    AgentRunAssistantMessageEvent:
      title: AgentRunAssistantMessageEvent
      type: object
      additionalProperties: false
      required: [role, content, toolCalls]
      description: >-
        The `event` of an `agent.run.assistant.message` frame: one complete
        reply from the child's model for one model round, with its text,
        reasoning, and requested tool calls.
      properties:
        role:
          type: string
          description: Always `assistant`.
        content:
          type: array
          description: >-
            The reply's content parts, in order. An empty array when the reply
            had no text, for example when it only called tools.
          items:
            $ref: "#/components/schemas/Part"
        toolCalls:
          type: array
          description: >-
            The tool calls the reply requested, in order. An empty array when it
            requested none.
          items:
            $ref: "#/components/schemas/AgentRunToolCall"
        reasoning:
          type: string
          description: >-
            The reasoning text the model streamed in readable form, the same
            text as the round's `agent.run.thinking.delta` fragments joined.
            Absent when there was none.
        providerReasoning:
          title: AgentRunAssistantMessageProviderReasoning
          type: object
          description: >-
            The provider's own reasoning record for this reply, such as signed
            or encrypted reasoning blocks, kept as an opaque JSON object so it
            can be sent back to the same provider on later requests. Its shape
            belongs to the provider. Absent when the provider returned none.
        origin:
          type: string
          description: >-
            Where the message came from in the model layer. A reply from a
            model round is `turn`. Absent when unset.

