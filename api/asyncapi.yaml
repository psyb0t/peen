        content block. Calls in one round can run in parallel, so results can
        arrive in a different order from their `tool.use` frames. Peen stores
        the frame before it sends it, gives it a `metadata.sequence`, and sends
        it to every socket that is not filtered and to every socket filtered to
        its session. `GET /api/v1/session/feed` replays it with the same `id`,
        `timestamp`, and data.
      properties:
        id:
          type: string
          format: uuid
          description: >-
