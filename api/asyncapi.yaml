      title: ServerEvent
      description: >-
        Any frame the server sends, selected by `type`. `message.completed` and
        `message.failed` are unsequenced acknowledgements of one client frame.
        Every other type is a sequenced feed frame with `metadata.sequence`:
        the model's reply as `content_block_*` blocks, Peen's protocol events
        for a root turn, `agent.run.*` steps of child agent runs, and
        `notice.created`. A client should skip a `type` it does not know and
        still advance its cursor past that frame's sequence.
