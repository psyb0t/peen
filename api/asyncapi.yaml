        metadata:
          $ref: "#/components/schemas/Metadata"
        triggeredBy:
          type: [string, "null"]
          format: uuid
          description: >-
            Always `null` on a stored frame, because Peen renders it from the
            stored record the same way live and on replay. Correlate stored
            frames through `metadata.requestId` instead.

    TurnCompletedData:
      title: TurnCompletedData
      type: object
      additionalProperties: false
      required: [model, text]
      description: >-
        The `data` of a `turn.completed` frame. `GET /api/v1/session/turns`
        returns the same `output` and `outputError` with the stored turn.
      properties:
        output:
          description: >-
            The validated JSON value of the final answer. Present only when the
            message carried `outputSchema` and an attempt passed validation.
        outputError:
          type: string
          description: >-
            Why no structured output attempt passed validation, or why the
            attempts stopped, such as reaching the turn token budget. Present
            only when the message carried `outputSchema` and no attempt passed.
            The turn still completes.
        model:
          type: string
          description: The model the turn ran on, as `provider/model`.
        text:
          type: string
          description: >-
            The model's final reply text. It can be empty, for example when the
            reply hit the output token limit while the model was still
            reasoning.
        finishReason:
          type: string
          description: >-
            Why the model stopped its final reply, as the provider reported
            it, such as `stop`, or `length` when the reply reached the output
            token limit and was cut off. Absent when the provider reported no
            reason.

    TurnCompleted:
      title: TurnCompleted
      type: object
      additionalProperties: false
      required: [id, type, data, timestamp, metadata]
      description: >-
        The turn finished. It is the turn's last frame. Its messages are
        stored, and `GET /api/v1/messages` returns them. A message that started
        the turn then gets `message.completed` with `queued: false`. Peen
        stores the frame before it sends it, gives it a `metadata.sequence`,
        and sends it to every socket that is not filtered and to every socket
        filtered to its session. `GET /api/v1/session/feed` replays it with the
        same `id`, `timestamp`, and data.
      properties:
        id:
          type: string
          format: uuid
          description: >-
            The ID of the stored record this frame renders. It is the same live
            and on replay through `GET /api/v1/session/feed`, so you can use it
            to skip a frame you already applied.
        type:
          type: string
          const: turn.completed
          description: The frame type, `turn.completed`. Switch on it to read `data`.
        data:
          $ref: "#/components/schemas/TurnCompletedData"
        timestamp:
          type: integer
          format: int64
          description: >-
            When Peen stored the record, in Unix seconds. It is the same live
            and on replay, so it does not tell you which path delivered the
            frame.
        metadata:
          $ref: "#/components/schemas/Metadata"
        triggeredBy:
          type: [string, "null"]
          format: uuid
          description: >-
            Always `null` on a stored frame, because Peen renders it from the
            stored record the same way live and on replay. Correlate stored
            frames through `metadata.requestId` instead.

    TurnFailedData:
      title: TurnFailedData
      type: object
      additionalProperties: false
      required: [reason]
      description: The `data` of a `turn.failed` frame.
      properties:
        reason:
          type: string
          const: agentRun
          description: Always `agentRun`.
        error:
          type: string
          maxLength: 2048
          description: >-
            The error the turn ended with, without source locations, cut to
            2048 bytes. A turn whose worker or controller stopped before it
            ended reads `the worker or controller stopped mid-turn`. Absent
            when the turn failed before Peen recorded an error.

    TurnFailed:
      title: TurnFailed
      type: object
      additionalProperties: false
      required: [id, type, data, timestamp, metadata]
      description: >-
        The turn ended with an error, or its worker or controller stopped
        before it ended. It is the turn's last frame. Every tool call still
        running first gets a `tool.result` with `isError` set, so every
        `tool.use` has a result. Peen stores a `turn.failed` session notice in
        the same transaction, so a `notice.created` frame for it follows nearby
        in the feed. A message that started the turn gets `message.failed`.
        Peen stores the frame before it sends it, gives it a
        `metadata.sequence`, and sends it to every socket that is not filtered
        and to every socket filtered to its session.
        `GET /api/v1/session/feed` replays it with the same `id`, `timestamp`,
        and data.
      properties:
        id:
          type: string
          format: uuid
          description: >-
            The ID of the stored record this frame renders. It is the same live
            and on replay through `GET /api/v1/session/feed`, so you can use it
            to skip a frame you already applied.
        type:
          type: string
          const: turn.failed
          description: The frame type, `turn.failed`. Switch on it to read `data`.
        data:
          $ref: "#/components/schemas/TurnFailedData"
        timestamp:
          type: integer
          format: int64
          description: >-
            When Peen stored the record, in Unix seconds. It is the same live
            and on replay, so it does not tell you which path delivered the
            frame.
        metadata:
          $ref: "#/components/schemas/Metadata"
        triggeredBy:
          type: [string, "null"]
          format: uuid
          description: >-
            Always `null` on a stored frame, because Peen renders it from the
            stored record the same way live and on replay. Correlate stored
            frames through `metadata.requestId` instead.

    TurnCancelledData:
      title: TurnCancelledData
      type: object
      additionalProperties: false
      required: [reason]
      description: The `data` of a `turn.cancelled` frame.
      properties:
        reason:
          type: string
          enum: [cancelled, timeout]
          description: |-
            Why the turn was stopped:

            - `cancelled`: something asked for the turn to stop, such as `POST /api/v1/session/cancel`, the browser Stop control, or shutting the controller down. The submission fails with `TURN_CANCELLED`.
            - `timeout`: the turn's deadline expired, from `timeoutSeconds` or `PEEN_TURN_TIMEOUT`. The submission fails with `TURN_TIMEOUT`.

    TurnCancelled:
      title: TurnCancelled
      type: object
      additionalProperties: false
      required: [id, type, data, timestamp, metadata]
      description: >-
        The turn was stopped before it finished. It is the turn's last frame.
        Every tool call still running first gets a `tool.result` with `isError`
        set, and Peen stores a `turn.cancelled` session notice in the same
        transaction, so a `notice.created` frame for it follows nearby in the
        feed. A Stop leaves pending input stored until something explicitly
        continues the session. Peen stores the frame before it sends it, gives
        it a `metadata.sequence`, and sends it to every socket that is not
        filtered and to every socket filtered to its session.
        `GET /api/v1/session/feed` replays it with the same `id`, `timestamp`,
        and data.
      properties:
        id:
          type: string
          format: uuid
          description: >-
            The ID of the stored record this frame renders. It is the same live
            and on replay through `GET /api/v1/session/feed`, so you can use it
            to skip a frame you already applied.
        type:
          type: string
          const: turn.cancelled
          description: The frame type, `turn.cancelled`. Switch on it to read `data`.
        data:
          $ref: "#/components/schemas/TurnCancelledData"
        timestamp:
          type: integer
          format: int64
          description: >-
            When Peen stored the record, in Unix seconds. It is the same live
            and on replay, so it does not tell you which path delivered the
            frame.
        metadata:
          $ref: "#/components/schemas/Metadata"
        triggeredBy:
          type: [string, "null"]
          format: uuid
          description: >-
            Always `null` on a stored frame, because Peen renders it from the
            stored record the same way live and on replay. Correlate stored
            frames through `metadata.requestId` instead.

    NoticeCreated:
      title: NoticeCreated
      type: object
      additionalProperties: false
      required: [id, type, data, timestamp, metadata]
      description: >-
        Peen recorded a session notice. Every recorded notice produces one when
        it is stored, whatever its `delivery` mode and whether or not it has
        reached the model yet. It belongs to no turn and carries no
        `metadata.requestId`. When the notice later reaches the model, it
        appears again inside a `session.events` frame. Peen stores the frame
        before it sends it, gives it a `metadata.sequence`, and sends it to
        every socket that is not filtered and to every socket filtered to its
        session. `GET /api/v1/session/feed` replays it with the same `id`,
        `timestamp`, and data.
      properties:
        id:
          type: string
          format: uuid
          description: >-
            The ID of the stored record this frame renders. It is the same live
            and on replay through `GET /api/v1/session/feed`, so you can use it
            to skip a frame you already applied.
        type:
          type: string
          const: notice.created
          description: The frame type, `notice.created`. Switch on it to read `data`.
        data:
          $ref: "#/components/schemas/SessionNotice"
        timestamp:
          type: integer
          format: int64
          description: >-
            When Peen stored the record, in Unix seconds. It is the same live
            and on replay, so it does not tell you which path delivered the
            frame.
        metadata:
          $ref: "#/components/schemas/Metadata"
        triggeredBy:
          type: [string, "null"]
          format: uuid
          description: >-
            Always `null` on a stored frame, because Peen renders it from the
            stored record the same way live and on replay. Correlate stored
            frames through `metadata.requestId` instead.

    # agent.run.* steps. Every envelope's data wraps the step in the running
    # child's identity: agentRunId, parentTurnId, and, for a grandchild,
    # parentAgentRunId.

    AgentRunStartedEvent:
      title: AgentRunStartedEvent
      type: object
      additionalProperties: false
      required:
        [agentRunId, parentTurnId, name, definition, depth, model, workspace]
      description: >-
        The `event` of an `agent.run.started` frame: who the new child is and
        where it runs. It repeats the identity fields of the frame's `data`.
      properties:
        agentRunId:
          type: string
          format: uuid
          description: The new child agent run's ID.
        parentTurnId:
          type: string
          format: uuid
          description: >-
            The root turn the run descends from, the same as the frame's
            `data.parentTurnId`.
        parentAgentRunId:
          type: string
          format: uuid
          description: >-
            The agent run that launched this one. Absent when the session's
            root conversation launched it.
        name:
          type: string
          description: >-
            The agent's name: the stored agent's name as the agent catalogue
            lists it, such as `reviewer` or `core:general-purpose`, or the
            `name` of an inline definition.
        definition:
          title: AgentRunDefinition
          type: string
          enum: [stored, ad-hoc]
          description: |-
            Where the child's instructions came from:

            - `stored`: the child is an agent from the workspace's agent catalogue, named with `launchAgent`'s `agent`.
            - `ad-hoc`: the child was defined inline with `launchAgent`'s `agentDefinition`. Its instructions are never written to disk.
        depth:
          type: integer
          description: >-
            How deeply the run is nested. A child of the root conversation has
            depth 1 and its own children depth 2. `PEEN_MAX_CHILD_AGENT_DEPTH`
            (5 by default) caps it.
        model:
          type: string
          description: >-
            The model the child runs on, in the `provider/model` form that
            `GET /api/v1/models` lists as `name`.
        workspace:
          type: string
          description: The directory the child's tool calls start in.

    AgentRunStartedData:
      title: AgentRunStartedData
      type: object
      additionalProperties: false
      required: [agentRunId, parentTurnId, event]
      description: >-
        The `data` of an `agent.run.started` frame. `event` is an
        `AgentRunStartedEvent` describing the new child.
      properties:
        agentRunId:
          type: string
          format: uuid
          description: >-
            The child agent run this step belongs to. Group a run's frames by
            this ID; `GET /api/v1/session/agents/{agentRunId}` returns the run
            record.
        parentTurnId:
          type: string
          format: uuid
          description: >-
            The root turn the run descends from: the turn in which the root
            conversation launched this run, or launched its top-level ancestor.
            Every run in one tree shares it, and a run can keep going after
            that turn ends.
        parentAgentRunId:
          type: string
          format: uuid
          description: >-
            The agent run that launched this one. Absent when the session's
            root conversation launched it.
        event:
          $ref: "#/components/schemas/AgentRunStartedEvent"

    AgentRunStarted:
      title: AgentRunStarted
      type: object
      additionalProperties: false
      required: [id, type, data, timestamp, metadata]
      description: >-
        A child agent run started. Sent once per run, after Peen records the
        run and its task and before the child's first model request, so it is
        the first frame of every run. Peen stores the frame before it sends it,
        gives it a `metadata.sequence`, and sends it to every socket that is
        not filtered and to every socket filtered to its session.
        `GET /api/v1/session/feed` replays it with the same `id`, `timestamp`,
        and data. Its `metadata` carries `sessionId` and `sequence` but never
        `requestId`.
      properties:
        id:
          type: string
          format: uuid
          description: >-
            The ID of the stored child event this frame renders. It is the same
            live and on replay through `GET /api/v1/session/feed`, so you can
            use it to skip a frame you already applied.
        type:
          type: string
          const: agent.run.started
          description: >-
            The frame type, `agent.run.started`. Switch on it to read `data`.
        data:
          $ref: "#/components/schemas/AgentRunStartedData"
        timestamp:
          type: integer
          format: int64
          description: >-
            When Peen stored the child event, in Unix seconds. It is the same
            live and on replay, so it does not tell you which path delivered
            the frame.
        metadata:
          $ref: "#/components/schemas/Metadata"
        triggeredBy:
          type: [string, "null"]
          format: uuid
          description: >-
            Always `null` on a stored frame, because Peen renders it from the
            stored record the same way live and on replay. Group a child run's
            frames by `data.agentRunId` instead.

    AgentRunTextDeltaData:
      title: AgentRunTextDeltaData
      type: object
      additionalProperties: false
      required: [agentRunId, parentTurnId, event]
      description: >-
        The `data` of an `agent.run.text.delta` frame. `event` is `{text}`, one
        fragment of the child's reply text.
      properties:
        agentRunId:
          type: string
          format: uuid
          description: >-
            The child agent run this step belongs to. Group a run's frames by
            this ID; `GET /api/v1/session/agents/{agentRunId}` returns the run
            record.
        parentTurnId:
          type: string
          format: uuid
          description: >-
            The root turn the run descends from: the turn in which the root
            conversation launched this run, or launched its top-level ancestor.
            Every run in one tree shares it, and a run can keep going after
            that turn ends.
        parentAgentRunId:
          type: string
          format: uuid
          description: >-
            The agent run that launched this one. Absent when the session's
