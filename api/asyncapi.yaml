            and on replay, so it does not tell you which path delivered the
            frame.
        metadata:
          $ref: "#/components/schemas/Metadata"
        triggeredBy:
          type: [string, "null"]
          format: uuid
          description: >-
            Always `null` on a stored frame, because Peen renders it from the
            stored record the same way live and on replay. Correlate stored
            frames through `metadata.requestId` instead.

    MCPServerStatus:
      title: MCPServerStatus
      type: object
      additionalProperties: false
      required: [name, source, state, tools]
      description: One configured MCP server as Peen found it at the start of a turn.
      properties:
        name:
          type: string
          description: The server name from mcp.json. Empty when a whole mcp.json file was refused.
        source:
          title: MCPServerSource
          type: string
          enum: [config, workspace]
          description: |-
            The layer whose `.agents/mcp.json` defines the server:

            - `config`: `PEEN_CONFIG_DIR/.agents/mcp.json`, the deployment's configuration directory.
            - `workspace`: the session workspace's `.agents/mcp.json`, read only when `PEEN_WORKSPACE_MCP` is `true`. A workspace server never replaces a configuration directory server of the same name.
        transport:
          title: MCPServerTransport
          type: string
          enum: [stdio, http]
          description: |-
            How Peen reaches the server. Absent when a whole `mcp.json` file was refused.

            - `stdio`: a local process Peen starts and talks to over standard input and output.
            - `http`: a remote server reached over Streamable HTTP.
        state:
          title: MCPServerState
          type: string
          enum: [ready, failed]
          description: |-
            Whether the server started:

            - `ready`: the server started and its tools are available to the model.
            - `failed`: the server, or its whole `mcp.json` file, could not be used. `error` says why.
        tools:
          type: array
          description: >-
            The names of the server's tools as the model sees them,
            `mcp__<server>__<tool>`. Empty when the server failed.
          items:
            type: string
        error:
          type: string
          description: Why the server failed. Absent when `state` is `ready`.
        warnings:
          type: array
          description: >-
            Problems that did not stop the server, such as an allowlisted tool
            the server does not offer. Absent when there are none.
          items:
            type: string
        protocolVersion:
          type: string
          description: >-
            The MCP protocol version the connection speaks, such as
            `2026-07-28`, or `2025-11-25` for a server that predates it. At
            most 128 bytes. Absent for a failed server.
        serverInfo:
          title: MCPServerInfo
          type: object
          additionalProperties: false
          required: [name]
          description: >-
            What the server says it is. The server writes every field, each cut
            to 128 bytes. Absent when the server gave no name.
          properties:
            name:
              type: string
              description: The server implementation's name.
            title:
              type: string
              description: The server's display name. Absent when it gave none.
            version:
              type: string
              description: The server's version. Absent when it gave none.
        features:
          type: array
          description: |-
            The MCP capabilities the server advertised, whether or not its mcp.json entry turns them off. Absent for a failed server.

            - `tools`: tools the agent can call.
            - `resources`: resources and resource templates, which the agent reads with `listMcpResources` and `readMcpResource`.
            - `resourceSubscribe`: change notifications for single resources. Peen does not subscribe.
            - `prompts`: prompts a user invokes with `/mcp:<server>:<prompt>` and the agent reads with `listMcpPrompts` and `getMcpPrompt`.
            - `completions`: argument completion for prompts and resource templates. Peen does not use it.
          items:
            title: MCPServerFeature
            type: string
            enum: [tools, resources, resourceSubscribe, prompts, completions]
        instructionsBytes:
          type: integer
          minimum: 0
          description: >-
            The size in bytes of the instructions the server sent, after the
            `PEEN_MCP_MAX_INSTRUCTIONS_BYTES` cut when that limit is above
            zero. Absent when the server sent none or failed.
        instructionsIncluded:
          type: boolean
          description: >-
            Whether the server's instructions reach the agent's system prompt.
            They do when the server sent some, its mcp.json entry does not set
            `instructions` to false, and `PEEN_MCP_MAX_INSTRUCTIONS_BYTES` is
            above zero. Absent when false.
        instructionsCut:
          type: boolean
          description: >-
            Whether the server's instructions were longer than
            `PEEN_MCP_MAX_INSTRUCTIONS_BYTES` and only their start is kept.
            Absent when false.
        prompts:
          type: array
          description: >-
            The prompts the server offers, which a user invokes with a message
            that starts with `/mcp:<server>:<prompt>`. At most the first 50 of
            the server's first page. Absent when the server offers none, its
            mcp.json entry sets `prompts` to false, or it failed.
          items:
            title: MCPPrompt
            type: object
            additionalProperties: false
            required: [name, arguments]
            description: One prompt an MCP server offers. The server writes every field.
            properties:
              name:
                type: string
                description: The prompt name to put after `/mcp:<server>:`.
              title:
                type: string
                description: The prompt's display name, cut to 256 bytes. Absent when it gave none.
              description:
                type: string
                description: What the prompt does, cut to 256 bytes. Absent when it gave none.
              arguments:
                type: array
                description: The arguments the prompt takes, each passed as `name=value`. Empty when it takes none.
                items:
                  title: MCPPromptArgument
                  type: object
                  additionalProperties: false
                  required: [name, required]
                  description: One argument an MCP prompt takes.
                  properties:
                    name:
                      type: string
                      description: The argument name.
                    description:
                      type: string
                      description: What the argument holds, cut to 256 bytes. Absent when the server gave none.
                    required:
                      type: boolean
                      description: Whether the prompt needs the argument.

    MCPStatusData:
      title: MCPStatusData
      type: object
      additionalProperties: false
      required: [servers]
      description: The `data` of an `mcp.status` frame.
      properties:
        servers:
          type: array
          description: >-
            Every configured MCP server, in configuration order. Empty when the
            session has no MCP servers configured.
          items:
            $ref: "#/components/schemas/MCPServerStatus"

    MCPStatus:
      title: MCPStatus
      type: object
      additionalProperties: false
      required: [id, type, data, timestamp, metadata]
      description: >-
        The session's MCP servers at the start of a turn. Peen emits it on
        every turn, after any `harness.warning` and before `turn.started`,
        re-reading the `mcp.json` files first, so a client always sees the
        current state. A session with no MCP servers configured gets an empty
        `servers` list. `GET /api/v1/session/mcp` returns the latest one. Peen
        stores the frame before it sends it, gives it a `metadata.sequence`,
        and sends it to every socket that is not filtered and to every socket
        filtered to its session. `GET /api/v1/session/feed` replays it with the
        same `id`, `timestamp`, and data.
      properties:
        id:
          type: string
          format: uuid
          description: >-
            The ID of the stored record this frame renders. It is the same live
            and on replay through `GET /api/v1/session/feed`, so you can use it
            to skip a frame you already applied.
        type:
          type: string
          const: mcp.status
          description: The frame type, `mcp.status`. Switch on it to read `data`.
        data:
          $ref: "#/components/schemas/MCPStatusData"
        timestamp:
          type: integer
          format: int64
          description: >-
            When Peen stored the record, in Unix seconds. It is the same live
            and on replay, so it does not tell you which path delivered the
            frame.
        metadata:
          $ref: "#/components/schemas/Metadata"
        triggeredBy:
          type: [string, "null"]
          format: uuid
          description: >-
            Always `null` on a stored frame, because Peen renders it from the
            stored record the same way live and on replay. Correlate stored
            frames through `metadata.requestId` instead.

    QuestionAskedEvent:
      title: QuestionAskedEvent
      type: object
      additionalProperties: false
      required: [id, type, data, timestamp, metadata]
      description: >-
        The root conversation asked you a question with the `ask` tool, or an
        MCP server asked one while its call ran, and is waiting. Send your
        answer as the next `message.send`: it joins the running turn's queue
        and reaches the waiting model, and for an MCP server's question also
        goes back to the server. A
        `question.answered` frame follows when the ask ends. A child agent's
        questions arrive as `agent.run.question` instead. Peen stores the frame
        before it sends it, gives it a `metadata.sequence`, and sends it to
        every socket that is not filtered and to every socket filtered to its
        session. `GET /api/v1/session/feed` replays it with the same `id`,
        `timestamp`, and data.
      properties:
        id:
          type: string
          format: uuid
          description: >-
            The ID of the stored record this frame renders. It is the same live
            and on replay through `GET /api/v1/session/feed`, so you can use it
            to skip a frame you already applied.
        type:
          type: string
          const: question.asked
          description: The frame type, `question.asked`. Switch on it to read `data`.
        data:
          $ref: "#/components/schemas/QuestionAsked"
        timestamp:
          type: integer
          format: int64
          description: >-
            When Peen stored the record, in Unix seconds. It is the same live
            and on replay, so it does not tell you which path delivered the
            frame.
        metadata:
          $ref: "#/components/schemas/Metadata"
        triggeredBy:
          type: [string, "null"]
          format: uuid
          description: >-
            Always `null` on a stored frame, because Peen renders it from the
            stored record the same way live and on replay. Correlate stored
            frames through `metadata.requestId` instead.

    QuestionAnsweredEvent:
      title: QuestionAnsweredEvent
      type: object
      additionalProperties: false
      required: [id, type, data, timestamp, metadata]
      description: >-
        The root conversation's `ask` ended, because a message reached it or
        because it timed out. It follows the matching `question.asked`. Peen
        stores the frame before it sends it, gives it a `metadata.sequence`,
        and sends it to every socket that is not filtered and to every socket
        filtered to its session. `GET /api/v1/session/feed` replays it with the
        same `id`, `timestamp`, and data.
      properties:
        id:
          type: string
          format: uuid
