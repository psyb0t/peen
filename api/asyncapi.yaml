            use it to skip a frame you already applied.
        type:
          type: string
          const: agent.run.text.delta
          description: >-
            The frame type, `agent.run.text.delta`. Switch on it to read
            `data`.
        data:
          $ref: "#/components/schemas/AgentRunTextDeltaData"
        timestamp:
          type: integer
          format: int64
          description: >-
            When Peen stored the child event, in Unix seconds. It is the same
            live and on replay, so it does not tell you which path delivered
            the frame.
        metadata:
          $ref: "#/components/schemas/Metadata"
        triggeredBy:
          type: [string, "null"]
          format: uuid
          description: >-
            Always `null` on a stored frame, because Peen renders it from the
            stored record the same way live and on replay. Group a child run's
            frames by `data.agentRunId` instead.

    AgentRunThinkingDeltaData:
      title: AgentRunThinkingDeltaData
      type: object
      additionalProperties: false
      required: [agentRunId, parentTurnId, event]
      description: >-
        The `data` of an `agent.run.thinking.delta` frame. `event` is `{text}`,
        one fragment of the child's reasoning.
      properties:
        agentRunId:
          type: string
          format: uuid
          description: >-
            The child agent run this step belongs to. Group a run's frames by
            this ID; `GET /api/v1/session/agents/{agentRunId}` returns the run
            record.
        parentTurnId:
          type: string
          format: uuid
          description: >-
            The root turn the run descends from: the turn in which the root
            conversation launched this run, or launched its top-level ancestor.
            Every run in one tree shares it, and a run can keep going after
