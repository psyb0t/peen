        each tool boundary inside a running turn, right after a tool result. A
        `turn.failed` or `turn.cancelled` notice is listed here too, though the
        model does not receive it as event data. Only the root conversation
        receives session events. Peen stores the frame before it sends it,
        gives it a `metadata.sequence`, and sends it to every socket that is
        not filtered and to every socket filtered to its session.
        `GET /api/v1/session/feed` replays it with the same `id`, `timestamp`,
        and data.
      properties:
