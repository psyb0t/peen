asyncapi: 3.0.0
info:
  title: Peen WebSocket API
  version: 1.0.0
  description: |-
    The live socket for Peen. A client sends `message.send` frames here to start a turn, to queue a message into a running turn, or to message a running child agent, and receives every frame its sessions produce as they happen. This socket is the only way to send a user message. The REST API under `/api/v1` reads what Peen stored and controls running work; a session's work keeps running when no client is connected.

    ## Connecting

    Open a WebSocket to `/ws/v1` (`wss://` in deployment) and offer the `peen.v1` subprotocol. The server selects it.

    When the deployment sets `PEEN_API_TOKEN`, the handshake must carry the token, or the upgrade is refused with HTTP 401 `UNAUTHORIZED`:

    - A client outside a browser sends `Authorization: Bearer <token>`.
    - A browser, which cannot set headers on a WebSocket, offers a second subprotocol, `peen.bearer.<base64url-token>`, where `<base64url-token>` is the token in unpadded URL-safe Base64. The server still selects `peen.v1`.

    Never put the token in the URL. A handshake that carries an `Origin` header must name the same host as the request; one without an `Origin` header is accepted.

    Add `?sessionId=<uuid>` to receive only one session's frames. The value must appear once and be a canonical lowercase UUIDv4, or the upgrade fails with HTTP 400 `INVALID_SESSION_ID`. The filter only selects frames: it does not create, open, or authorize a session, and closing the socket stops nothing. Without it, the socket receives the frames of every session.

    ## Sending

    The only client frame is `message.send`. Every one must carry an `id`, a UUID you generate, and must name its session in `metadata.sessionId`, a canonical UUIDv4 from `POST /api/v1/sessions/open`, `GET /api/v1/sessions`, or `POST /api/v1/sessions/system`. The session ID routes the message; it does not grant access, and the message body cannot redirect it. Only an embedded single-workspace runtime accepts a frame without a session and uses its own session. Frames of any other `type` are ignored without a reply. A frame without an `id`, with a null `id`, or with the all-zero UUID gets `message.failed` with `VALIDATION_FAILED` and starts nothing. A frame that is not valid JSON in the frame's shape, whose `id` is not a UUID string, or that has a field of the wrong type gets `message.failed` with `VALIDATION_FAILED` on the sending socket only, with a null `triggeredBy` and no `metadata.sessionId`, and starts nothing; the connection stays open. A frame larger than the deployment's read limit (sized from the message, system prompt, output schema, and image limits) makes the server stop reading and close the connection with status 1009.

    Peen accepts each session's messages in the order it receives them, from every client. The first starts a turn; a message that arrives while that turn runs joins its queue. Peen gives every accepted message a request ID, carried in `metadata.requestId` of its acknowledgement and of the frames it causes.

    ## Sequenced frames and replay

    Every server frame except `message.completed` and `message.failed` is rendered from a stored record and carries `metadata.sequence`, its position in the session's feed. Sequences are per session, start at 1, and count up by one across root turn events, `agent.run.*` child steps, and `notice.created` frames. Peen sends a frame only after its record is committed, in sequence order. A sequenced frame's `id` is the stored record's ID, its `timestamp` is the record's creation time in Unix seconds, and its `triggeredBy` is null, so it reads the same live and replayed.

    Track the last sequence applied per session. After connecting or reconnecting, call `GET /api/v1/session/feed` with that session's `X-Session-ID` and `cursor` set to the last sequence applied (0 for the start), apply the returned frames in order, and repeat with `nextCursor` while `hasMore` is true. Then apply live frames, skipping any whose sequence is not greater than the last one applied. `GET /api/v1/session` reports the feed head as `feedSequence`, and `activeTurnFeedSequence` while a turn runs.

    ## Acknowledgements

    `message.completed` and `message.failed` answer one `message.send`. They are never stored, never replayed, and carry no `metadata.sequence`. `triggeredBy` is the `id` of the client frame they answer, so match on it: they reach every socket that receives that session's frames, not only the sender. Four failures go only to the sending socket: a frame without an `id`, which gets a null `triggeredBy` and no `metadata.sessionId`; a frame that does not decode, such as invalid JSON or an `id` that is not a UUID string, which gets the same; a frame whose session could not be resolved, which also carries no `metadata.sessionId`; and a frame whose `data` failed validation. Acknowledgements travel outside the feed, so they are not ordered against sequenced frames.

    `message.completed` arrives when the turn the message started ends, with `queued: false`, or as soon as the message joins a running turn's queue or a child's inbox, with `queued: true`. `message.failed` carries one of these codes:

    - `VALIDATION_FAILED`: the frame was invalid. Examples: a missing `id`, a missing or malformed `metadata.sessionId`, an unknown or missing field, a bad value, a message or system prompt over its byte limit, images the model cannot take or that break the image limits, an unknown `:skill` name, a queued message that tries to change the running turn's model, reasoning effort, or system prompt, or a field combined with `to` or `system` that cannot be. `message` names the problem when it is safe to show.
    - `SESSION_NOT_FOUND`: `metadata.sessionId` names no session.
    - `SESSION_BUSY`: the message carries `outputSchema` or `timeoutSeconds` and a turn is already active, or it otherwise conflicts with the active turn.
    - `USER_MESSAGE_QUEUE_FULL`: the running turn's queue, or the child's inbox, already holds `PEEN_MAX_QUEUED_USER_MESSAGES` messages (16 by default).
    - `OUTPUT_SCHEMA_INVALID`: `outputSchema` is over `PEEN_MAX_OUTPUT_SCHEMA_BYTES`, does not compile, or references an external resource.
    - `TURN_CANCELLED`: the turn the message started was stopped.
    - `TURN_TIMEOUT`: the turn's deadline, from `timeoutSeconds` or `PEEN_TURN_TIMEOUT`, expired.
    - `TURN_ROUND_LIMIT`: the turn used up `PEEN_MAX_TOOL_ROUNDS` tool rounds.
    - `TURN_TOKEN_LIMIT`: the turn billed `PEEN_MAX_TURN_TOKENS` tokens.
    - `AGENT_FINISHED`: `to` names a child agent that has already ended.
    - `AGENT_NOT_FOUND`: `to` names an agent run this session never had.
    - `HARNESS_CONFIGURATION_INVALID`: the workspace agent configuration stops the turn from starting. `reason` says what to fix.
    - `INTERNAL_SERVER_ERROR`: any other failure, including provider, worker, and tool errors. The message never includes their details.
    - `AGENT_PAUSED`: deprecated and never sent. A message to a paused child resumes it.
servers:
  peen:
    host: 127.0.0.1:8080
    pathname: /ws/v1
    protocol: ws
    description: >-
      A controller on the local machine at its default port. `PEEN_HTTP_LISTEN_ADDRESS`
      sets the address, `:8080` by default. Replace the host with your
      deployment's and use `wss://` behind TLS. Offer the `peen.v1`
      subprotocol, and, when `PEEN_API_TOKEN` is set, authenticate with an
      `Authorization: Bearer` header or the `peen.bearer.<base64url-token>`
      subprotocol. An optional `?sessionId=<uuid>` filters the socket's frames
      to one session; without it the socket receives every session's frames.
channels:
  socket:
    address: /ws/v1
    description: >-
      The one WebSocket at `/ws/v1`. Clients send `message.send` frames and
      receive server frames for every session they watch, or for the one
      session named by `?sessionId=`.
    messages:
      messageSend:
        summary: >-
          Send a message to a session, its running turn, or one of its child
          agents.
        description: >-
          The `message.send` frame, the only frame a client sends. It starts a
          turn, joins a running turn's queue, or, with `data.to`, reaches a
          running child agent's inbox. Peen answers with `message.completed` or
          `message.failed`, whose `triggeredBy` is this frame's `id`.
        payload:
          $ref: "#/components/schemas/MessageSend"
      serverEvent:
        summary: >-
          A frame the server sends: a sequenced session frame or an
          acknowledgement.
        description: >-
          Every server frame, told apart by `type`. All are sequenced feed
          frames that `GET /api/v1/session/feed` can replay, except
          `message.completed` and `message.failed`, which acknowledge one
          client frame and are never stored.
        payload:
          $ref: "#/components/schemas/ServerEvent"
operations:
  sendMessage:
    action: send
    description: >-
      Send `message.send` frames. Each must carry a unique `id` and name its
      session in `metadata.sessionId`. Peen accepts a session's messages in
      arrival order: the first starts a turn and later ones join its queue
      until it ends. Watch for the `message.completed` or `message.failed`
      frame whose `triggeredBy` equals the frame's `id`.
    channel:
      $ref: "#/channels/socket"
    messages:
      - $ref: "#/channels/socket/messages/messageSend"
  receiveEvents:
    action: receive
    description: >-
      Receive server frames. Apply sequenced frames in `metadata.sequence`
      order per session and keep the last sequence applied, so a reconnecting
      client can catch up through `GET /api/v1/session/feed`. Treat a frame
      whose `type` you do not know as skippable, but still advance your cursor
      past its sequence.
    channel:
      $ref: "#/channels/socket"
    messages:
      - $ref: "#/channels/socket/messages/serverEvent"
components:
  schemas:
    Metadata:
      title: Metadata
      type: object
      additionalProperties: false
      description: >-
        Routing and cursor information carried in every frame's `metadata`. On
        `message.send` only `sessionId` is read. On server frames, which fields
        are present depends on the frame: see each property.
      properties:
        sessionId:
          type: string
          format: uuid
          description: >-
            The session the frame belongs to, as a canonical lowercase UUIDv4.
            On `message.send` it routes the message to that session; a value
            that is not a canonical UUIDv4 string fails the message with
            `VALIDATION_FAILED`. A client with no session to name, such as an
            embedded single-workspace runtime, may omit it, and the message
            then runs against the runtime's own session; a controller has no
            such session, so it refuses a message without one. Every server
            frame carries it, except a `message.failed` answering a message
            Peen could not route or a `message.send` that carried no `id`.
        requestId:
          type: string
          format: uuid
          description: >-
            The ID Peen assigns to one submission. Every frame of a turn
            carries the turn's request ID, except the `userMessage.*` frames of
            a message queued into that turn, which carry the queued message's
            own. `message.completed` and `message.failed` carry the request ID
            of the submission they answer, so use it to find that submission's
            stored frames. Absent on `agent.run.*` and `notice.created`. Peen
            ignores a value sent on `message.send`.
        sequence:
          type: integer
          format: int64
          minimum: 1
          description: >-
            The frame's position in its session's feed. Sequences count up
            from 1 with no gaps across every stored frame of the session.
            Present only on stored frames, never on `message.completed` or
            `message.failed`. To catch up after a reconnect, pass the last
            sequence you applied as `cursor` to `GET /api/v1/session/feed`.
            Peen ignores a value sent on `message.send`.

    # Shared data shapes, referenced from more than one frame.

    ToolUse:
      title: ToolUse
      type: object
      additionalProperties: false
      required: [callId, name, arguments]
      description: >-
        One tool call the model requested. It is the `data` of a root
        `tool.use` frame and the `event` of a child's `agent.run.tool.use`
        frame.
      properties:
        callId:
          type: string
          description: >-
            The call ID the model assigned. The matching `tool.result`, the
            `tool_use` content block's `id`, and the `tool_result` block's
            `tool_use_id` carry the same value.
        name:
          type: string
          description: >-
            The name of the tool the model called, as the tool catalogue lists
            it. An MCP tool is named `mcp__<server>__<tool>`.
        arguments:
          title: ToolUseArguments
          type: [object, 'null']
          description: >-
            Open. The tool's own arguments, shaped by that tool, exactly as the
            provider returned them; null when the provider sent none.

    ToolResult:
      title: ToolResult
      type: object
      additionalProperties: false
      required: [callId, name, content, isError]
      description: >-
        The outcome of one tool call. It is the `data` of a root `tool.result`
        frame and the `event` of a child's `agent.run.tool.result` frame. Every
        `tool.use` gets exactly one result, even when its turn is stopped or
        fails while the call runs.
      properties:
        callId:
          type: string
          description: The call ID of the `tool.use` this result answers.
        name:
          type: string
          description: The name of the tool that ran.
        content:
          type: string
          description: >-
            The result text as Peen hands it to the model. A call still running
            when its turn or child run was stopped gets the fixed text "The tool
            call was stopped before it returned a result. Its effect is
            unknown." with `isError` set.
        isError:
          type: boolean
          description: >-
            `true` when the tool reported an error or the call was stopped
            before it returned, `false` otherwise.

    ProviderRetry:
      title: ProviderRetry
      type: object
      additionalProperties: false
      required: [attempt, reason, status, delayMs]
      description: >-
        One failed provider request that Peen is about to retry. It is the
        `data` of a root `provider.retry` frame and the `event` of a child's
        `agent.run.provider.retry` frame. Peen sends it before it waits, so
        `delayMs` is the wait still ahead. Only retryable failures (rate
        limits, server errors, timeouts, and broken connections) produce it; a
        failure Peen does not retry ends the turn instead.
      properties:
        attempt:
          type: integer
          description: The number of the attempt that failed, counting from 1.
        reason:
          title: ProviderRetryReason
          type: string
          enum: ["", rate_limited, server_error, timeout, transport]
          description: |-
            Why the attempt failed:

            - `""`: the failure was not classified. Peen does not retry such a failure, so a frame rarely carries it.
            - `rate_limited`: the provider refused the request for rate limiting (HTTP 429 or the provider's rate limit code).
            - `server_error`: the provider reported a server-side error or overload.
            - `timeout`: the connection to the provider timed out.
            - `transport`: the connection to the provider failed or broke before the provider answered.
        status:
          type: integer
          description: >-
            The HTTP status the failed attempt returned. `0` when the failure
            carried no HTTP status, such as a broken connection. A provider that
            reports an error inside a streamed response can leave this at
            `200`.
        delayMs:
          type: integer
          format: int64
          description: >-
            How long Peen waits before the next attempt, in milliseconds.

    UserMessage:
      title: UserMessage
      type: object
      additionalProperties: false
      required: [message]
      description: >-
        A user message Peen accepted. It is the `data` of
        `userMessage.created`, `userMessage.queued`, and
        `userMessage.delivered`.
      properties:
        message:
          type: string
          description: >-
            The message text as it was accepted. For a turn a session event
            started, this is the event handler's instructions.
        sourceEventId:
          type: string
          format: uuid
          description: >-
            The `id` of the `message.send` frame that carried the message.
            Absent when no WebSocket frame carried it, such as a turn a session
            event started.
        images:
          type: array
          description: >-
            The images the message carries, without their bytes. Absent when
            the message has none, and always absent on `userMessage.delivered`.
          items:
            $ref: "#/components/schemas/UserMessageImage"

    UserMessageImage:
      title: UserMessageImage
      type: object
      additionalProperties: false
      required: [mediaType, sizeBytes]
      description: >-
        One image a user message carries, described without its bytes. It
        appears in `userMessage.created` and `userMessage.queued`.
      properties:
        mediaType:
          type: string
          description: >-
            The image's media type, as the `message.send` frame gave it:
            `image/png`, `image/jpeg`, `image/gif`, or `image/webp`.
        sizeBytes:
          type: integer
          description: The decoded size of the image in bytes.

    MessageImage:
      title: MessageImage
      type: object
      additionalProperties: false
      required: [mediaType, data]
      description: >-
        One image attached to a `message.send`. Peen stores it with the message
        in the session database and replays it to the model on later turns.
      properties:
        mediaType:
          type: string
          enum: [image/png, image/jpeg, image/gif, image/webp]
          description: |-
            The image format. Peen checks that the decoded bytes are in the format this names and fails the message with `VALIDATION_FAILED` when they are not.

            - `image/png`: PNG image.
            - `image/jpeg`: JPEG image.
            - `image/gif`: GIF image.
            - `image/webp`: WebP image.
        data:
          type: string
          minLength: 1
          description: >-
            The image bytes, base64-encoded with the standard padded alphabet.
            At most `PEEN_MAX_IMAGE_BYTES` bytes once decoded, 5242880 by
            default. Data that is not valid base64, or decodes to more than the
            limit, fails the message with `VALIDATION_FAILED`.

    AgentRunInboxMessage:
      title: AgentRunInboxMessage
      type: object
      additionalProperties: false
      required: [message]
      description: >-
        A message accepted into a child agent's inbox: from the user through
        `message.send` with `to`, from another agent, or from Peen itself, such
        as a child's report to its parent, a session notice copied to running
        children, or the note that resumes a paused child. It is the `event` of
        `agent.run.message.queued`, `agent.run.message.delivered`, and
        `agent.run.message.undelivered`.
      properties:
        message:
          type: string
          description: >-
            The message as the child reads it. A message from the user or
            another agent is wrapped in the `<message>` block that names its
            sender.
        acceptanceId:
          type: string
          format: uuid
          description: >-
            Links one message's queued step to its delivered or undelivered
            step. Absent on events stored before Peen recorded it.

    QuestionAsked:
      title: QuestionAsked
      type: object
      additionalProperties: false
      required: [question]
      description: >-
        A question an agent asked with the `ask` tool, or a question an MCP
        server asked the user while one of its calls ran. It is the `data` of
        a root `question.asked` frame and the `event` of a child's
        `agent.run.question` frame. The agent or server waits until a message
        reaches it or the question times out. For the root conversation, your
        next message is the answer. An MCP server's question names the server
        and quotes its text, lists the fields it asks for, and takes a JSON
        object, the bare value of a one-field form, `decline`, or `cancel`.
      properties:
        question:
          type: string
          description: >-
            The question text. For an MCP server's question, the part between
            the `---` lines is the server's own text, at most 4096 bytes.
        callId:
          type: string
          description: >-
            The call ID of the `ask` tool call, or of the MCP tool call the
            server's question belongs to, matching its `tool.use` and the
            later answer frame. Absent on frames stored before Peen recorded
            it, and on an MCP server question that arrives outside the call's
            own request, from a server on a protocol before 2026-07-28.

    QuestionAnswered:
      title: QuestionAnswered
      type: object
      additionalProperties: false
      required: [answered]
      description: >-
        The end of an `ask` call. It is the `data` of a root
        `question.answered` frame and the `event` of a child's
        `agent.run.answer` frame. It carries no answer text: the answer is the
        message that reached the agent.
      properties:
        answered:
          type: boolean
          description: >-
            `true` when a message reached the agent before the ask timed out,
            `false` when it timed out.
        callId:
          type: string
          description: >-
            The call ID of the `ask` tool call this ends, matching the
            `question.asked` or `agent.run.question` frame. Present on every
            frame Peen sends now; absent only on frames stored before Peen
            recorded it.

    TextPayload:
      title: TextPayload
      type: object
      additionalProperties: false
      required: [text]
      description: >-
        One streamed fragment of a child agent's reply. It is the `event` of
        `agent.run.text.delta` and `agent.run.thinking.delta`.
      properties:
        text:
          type: string
          description: >-
            The fragment. Append it to the run's earlier fragments of the same
            kind, in sequence order.

    Notice:
      title: Notice
      type: object
      additionalProperties: false
      required: [id, sessionId, type, source, summary, delivery, createdAt]
      description: >-
        One session event as it reached the model, inside a `session.events`
        frame's `notices`. It is the same notice `GET /api/v1/session/notices`
        lists and that a `notice.created` frame announced when it was recorded.
      properties:
        id:
          type: string
          format: uuid
          description: The notice's ID, the same as on its `notice.created` frame.
        sessionId:
          type: string
          format: uuid
          description: The session the notice belongs to.
        type:
          type: string
          description: >-
            The event type, a lowercase dotted name such as `job.exited` or
            `ci.build.failed`, 1 to 8 parts and up to 128 characters. `job.*`,
            `agent.*`, and `turn.*` are reserved for events Peen publishes
            itself.
        source:
          type: string
          description: >-
            Who published the notice: `tools.job` for background jobs,
            `agent.launchAgent` for child agents, `session.turn` for turns that
            ended without completing, `hooks` for hooks, and `api` for
            `POST /api/v1/session/notices`.
        summary:
          type: string
          description: >-
            A one-line headline the model reads first. At most
            `PEEN_MAX_EVENT_SUMMARY_BYTES` bytes, 4096 by default.
        data:
          title: NoticeData
          type: object
          description: >-
            Open. A JSON object whose shape depends on `type`, at most
            `PEEN_MAX_EVENT_DATA_BYTES` bytes encoded, 65536 by default. Absent
            when the notice has none.
        delivery:
          title: NoticeDelivery
          type: string
          enum: [queue, wake]
          description: |-
            The delivery mode the publisher requested. A handler file for the type can override it.

            - `queue`: the notice waits for the next turn start or tool boundary and never starts a turn by itself.
            - `wake`: the notice may start a turn on an idle session when a handler for its type exists and the wake limit allows it; otherwise it is queued.
        createdAt:
          type: string
          format: date-time
          description: When Peen stored the notice, RFC 3339.

    SessionNotice:
      title: SessionNotice
      type: object
      additionalProperties: false
      required: [id, type, source, summary, delivery, createdAt]
      description: >-
        A session notice as Peen recorded it. It is the `data` of a
        `notice.created` frame, the same shape `GET /api/v1/session/notices`
        returns. It carries no `sessionId`; the frame's `metadata.sessionId`
        names the session.
      properties:
        id:
          type: string
          format: uuid
          description: >-
            The notice's ID. The same notice later appears with this ID in a
            `session.events` frame when it reaches the model.
        type:
          type: string
          description: >-
            The event type, a lowercase dotted name such as `job.exited` or
            `ci.build.failed`, 1 to 8 parts and up to 128 characters. `job.*`,
            `agent.*`, and `turn.*` are reserved for events Peen publishes
            itself.
        source:
          type: string
          description: >-
            Who published the notice: `tools.job` for background jobs,
            `agent.launchAgent` for child agents, `session.turn` for turns that
            ended without completing, `hooks` for hooks, and `api` for
            `POST /api/v1/session/notices`.
        summary:
          type: string
          description: >-
            A one-line headline the model reads first. At most
            `PEEN_MAX_EVENT_SUMMARY_BYTES` bytes, 4096 by default.
        data:
          title: SessionNoticeData
          type: object
          description: >-
            Open. A JSON object whose shape depends on `type`, at most
            `PEEN_MAX_EVENT_DATA_BYTES` bytes encoded, 65536 by default. Absent
            when the notice has none.
        delivery:
          title: SessionNoticeDelivery
          type: string
          enum: [queue, wake]
          description: |-
            The delivery mode the publisher requested. A handler file for the type can override it.

            - `queue`: the notice waits for the next turn start or tool boundary and never starts a turn by itself.
            - `wake`: the notice may start a turn on an idle session when a handler for its type exists and the wake limit allows it; otherwise it is queued.
        createdAt:
          type: string
          format: date-time
          description: When Peen stored the notice, RFC 3339.

    # The client's one message.

    MessageSystemPrompt:
      title: MessageSystemPrompt
      type: object
      additionalProperties: false
      required: [content, mode]
      description: >-
        Instructions for the turn this message starts, in `message.send`
        `data.systemPrompt`. Both fields are required when it is present. It
        applies to that turn only and does not carry over to the next message.
        A message queued into a running turn, or sent with `to`, cannot set it
        and fails with `VALIDATION_FAILED`.
      properties:
        content:
          type: string
          minLength: 1
          description: >-
            The instructions. Must not be empty. At most
            `PEEN_MAX_SYSTEM_PROMPT_BYTES` bytes, 65536 by default. The limit is
            deployment configuration, so the server enforces it, not this
            schema, and fails a longer prompt with `VALIDATION_FAILED`.
        mode:
          title: MessageSystemPromptMode
          type: string
          enum: [append, replace]
          description: |-
            How `content` combines with Peen's built-in prompt. Either way, the harness instructions, rules, and environment block still follow it.

            - `append`: Peen's built-in system prompt, followed by `content`.
            - `replace`: `content` in place of Peen's built-in system prompt.

    MessageSendData:
      title: MessageSendData
      type: object
      additionalProperties: false
      required: [message]
      description: >-
        The `data` of a `message.send` frame. Decoding is strict: an unknown
        field (`workspace` included), a missing or empty `message`, or a value
        outside its allowed range fails the message with `VALIDATION_FAILED`.
        `to` cannot combine with `model`, `reasoningEffort`, `systemPrompt`,
        `outputSchema`, `timeoutSeconds`, or `system`, because those settings
        belong to a root turn and not to a running child's inbox.
        `systemPrompt`, a `MessageSystemPrompt`, sets this turn's
        instructions.
      properties:
        system:
          type: boolean
          description: >-
            Set it to `true` on a message to the deployment's system session,
            and leave it out or `false` on every other message. The server fails
            a mismatch in either direction with `VALIDATION_FAILED`, and
            `system` cannot combine with `to`.
        message:
          type: string
          minLength: 1
          description: >-
            The text the model receives. It must contain at least one character
            that is not whitespace. At most `PEEN_MAX_MESSAGE_BYTES` bytes,
            262144 by default; the limit is deployment configuration, so the
            server enforces it, not this schema. Write `:skill-name`, or
            `:core:name` for a core skill, at the start or after a space to hand
            that skill to the model. An unknown skill name fails the message
            with `VALIDATION_FAILED`, and Peen stores nothing.
        model:
          type: string
          description: >-
            The model for this turn, as the `name` field of
            `GET /api/v1/models` (`provider/model`). Without it the turn uses
            `PEEN_DEFAULT_MODEL`. It applies to this turn only. A message queued
            into a running turn may repeat the running turn's model but cannot
            change it.
        reasoningEffort:
          title: MessageSendReasoningEffort
          type: string
          enum: [minimal, low, medium, high, xhigh, max]
          description: |-
            The reasoning level for this turn's model calls. Without it the model uses its own default. Peen fits the level to the model: a model without reasoning levels gets none, and a level outside its range runs at the nearest level it supports. A queued message may repeat the running turn's level but cannot change it.

            - `minimal`: the lowest reasoning level.
            - `low`: a low reasoning level.
            - `medium`: a medium reasoning level.
            - `high`: a high reasoning level.
            - `xhigh`: a level above `high`, for models that offer one.
            - `max`: the highest level the model offers.
        systemPrompt:
          $ref: "#/components/schemas/MessageSystemPrompt"
        outputSchema:
          type: object
          description: >-
            A JSON Schema object the turn's final answer must match. After the
            turn's work, Peen runs a final request without tools, validates the
            answer, and retries up to `PEEN_OUTPUT_SCHEMA_ATTEMPTS` total
            attempts, 3 by default. `turn.completed` reports the result in
            `output` or `outputError`. At most `PEEN_MAX_OUTPUT_SCHEMA_BYTES`
            bytes, 65536 by default. A schema that is too large, does not
            compile, or references an external resource fails with
            `OUTPUT_SCHEMA_INVALID`. Local references inside the schema work. It
            cannot combine with `to`, and a message that carries it while a turn
            is running fails with `SESSION_BUSY` instead of joining that turn.
        timeoutSeconds:
          type: integer
          minimum: 1
          maximum: 86400
          description: >-
            A deadline for the whole turn, in seconds. Without it
            `PEEN_TURN_TIMEOUT` applies, which is `0`, no limit, by default. The
            deadline is absolute and survives recovery, so downtime counts
            against it. When it expires, Peen stops the turn and its child
            agents, stores `turn.cancelled` with `reason` `timeout`, and fails
            the submission with `TURN_TIMEOUT`. It cannot combine with `to`, and
            a message that carries it while a turn is running fails with
            `SESSION_BUSY`.
        to:
          type: string
          format: uuid
          description: >-
            The `agentRunId` of a child agent of this session. The message goes
            to that child's inbox instead of the root conversation, starts no
            turn, and is answered at once with `message.completed`
            `{"queued": true}`. The child reads it after its current tool call,
            and a child that a Stop, crash, or failure paused resumes to read
            it. Fails with `AGENT_FINISHED` when the child has ended,
            `AGENT_NOT_FOUND` when the session has no such run, and
            `USER_MESSAGE_QUEUE_FULL` when the child's inbox already holds
            `PEEN_MAX_QUEUED_USER_MESSAGES` messages.
        images:
          type: array
          description: >-
            Images the model sees after the message text, at most
            `PEEN_MAX_IMAGES_PER_MESSAGE`, 4 by default. Only a model that
            accepts image input can take them: a message whose model does not
            fails with `VALIDATION_FAILED`, and Peen never drops or converts an
            image to make a message fit. A message queued into a running turn,
            or sent with `to`, may carry images too. Once a session's history
            holds images, its turns can only run on models that accept images.
          items:
            $ref: "#/components/schemas/MessageImage"

    MessageSend:
      title: MessageSend
      type: object
      additionalProperties: false
      required: [id, type, data]
      description: |-
        The only frame a client sends. Each one submits one user message to the session that `metadata.sessionId` names. Naming the session routes the message but does not authorize it: Peen loads the session before it starts any work, and an unknown session fails with `SESSION_NOT_FOUND`. The first message for an idle session starts a turn. A message that arrives while a turn is running or starting joins that turn's queue, first in, first out, up to `PEEN_MAX_QUEUED_USER_MESSAGES` messages, 16 by default.

        Every accepted message is first stored as a `userMessage.created` frame. The submission ends with one `message.completed` or `message.failed`, whose `triggeredBy` is this frame's `id`. A frame without an `id`, with a null `id`, or with the all-zero UUID gets a `message.failed` with `VALIDATION_FAILED` on this socket only, with a null `triggeredBy` and no `metadata.sessionId`, and starts nothing. A malformed `data` gets a `message.failed` on this socket only. A failure after Peen accepted the frame reaches every socket watching the session. Peen ignores a frame of any other `type` and does not reply to it. A frame that is not valid JSON in this shape, whose `id` is not a UUID string, or that has a field of the wrong type gets a `message.failed` with `VALIDATION_FAILED` on this socket only, with a null `triggeredBy` and no `metadata.sessionId`, and starts nothing; the connection stays open.
      properties:
        id:
          type: string
          format: uuid
          description: >-
            A UUID you generate for this frame; use a fresh UUIDv4 for each
            message. Peen echoes it as `triggeredBy` on the `message.completed`
            or `message.failed` that answers this frame, and as `sourceEventId`
            in the message's `userMessage.*` data. Required: a missing or null
            `id`, the all-zero UUID, or a value that is not a UUID string
            fails the frame with `VALIDATION_FAILED` and a null `triggeredBy`.
        type:
          type: string
          const: message.send
          description: Always `message.send`.
        data:
          $ref: "#/components/schemas/MessageSendData"
        timestamp:
          type: integer
          format: int64
          description: >-
            Not read by the server. Send `0` or the send time in Unix seconds.
        metadata:
          $ref: "#/components/schemas/Metadata"
        triggeredBy:
          type: [string, "null"]
          format: uuid
          description: Not read by the server. Send `null`.

    # Unsequenced server frames.

    MessageCompletedData:
      title: MessageCompletedData
      type: object
      additionalProperties: false
      required: [queued]
      description: The `data` of a `message.completed` frame.
      properties:
        queued:
          type: boolean
          description: >-
            `false` when the message started a turn and that turn completed.
            `true` when the message joined a running turn's queue or went to a
            child agent with `to`. `true` acknowledges only the submission:
            `userMessage.delivered`, or `agent.run.message.delivered` for a
            child, reports when the model actually received it.

    MessageCompleted:
      title: MessageCompleted
      type: object
      additionalProperties: false
      required: [id, type, data, timestamp, metadata]
      description: |-
        The successful end of one `message.send` submission. Peen sends it when the turn the message started completes, or at once when the message was queued into a running turn or sent to a child agent. It closes the submission, not the socket.

        It is a live acknowledgement: Peen does not store it, gives it no `metadata.sequence`, and never replays it through `GET /api/v1/session/feed`. It goes to every socket watching the session, not only the sender, so match `triggeredBy` against the frame IDs you sent. `metadata.requestId` is the request ID of the submission, which the stored frames of the turn or queued message also carry. It travels apart from the stored frames, so its order relative to the turn's terminal frame is not guaranteed.
      properties:
        id:
          type: string
          format: uuid
          description: >-
            A random UUID Peen generates for this acknowledgement. It is not
            stored and is never replayed.
        type:
          type: string
          const: message.completed
          description: The frame type, `message.completed`.
        data:
          $ref: "#/components/schemas/MessageCompletedData"
        timestamp:
          type: integer
          format: int64
          description: When Peen sent the frame, in Unix seconds.
        metadata:
          $ref: "#/components/schemas/Metadata"
        triggeredBy:
          type: [string, "null"]
          format: uuid
          description: >-
            The `id` of the `message.send` frame this frame answers. Match it
            against the IDs you sent to find the answer to your own message,
            since other sockets watching the session receive it too.

    MessageFailedData:
      title: MessageFailedData
      type: object
      additionalProperties: false
      required: [code, message]
      description: >-
        The `data` of a `message.failed` frame. Unknown provider, worker, and
        tool errors never expose their details: they arrive as
        `INTERNAL_SERVER_ERROR` with a generic message.
      properties:
        code:
          title: MessageFailedCode
          type: string
          description: |-
            Why the submission failed:

            - `VALIDATION_FAILED`: the frame or its settings were refused: a frame that is not valid JSON, a missing, null, all-zero, or non-UUID `id`, malformed or unknown fields, an empty or oversized message or system prompt, refused images, an unknown skill, a `system` mismatch, a session ID that is not a canonical UUIDv4, or a queued message that tried to change the running turn's settings.
            - `INTERNAL_SERVER_ERROR`: Peen failed for a reason it does not disclose. Nothing about the cause is exposed.
            - `SESSION_NOT_FOUND`: the session `metadata.sessionId` names does not exist.
            - `TURN_CANCELLED`: the turn the message started was stopped before it completed.
            - `TURN_TIMEOUT`: the turn's deadline, from `timeoutSeconds` or `PEEN_TURN_TIMEOUT`, expired.
            - `OUTPUT_SCHEMA_INVALID`: `outputSchema` is over its byte limit, does not compile, or references an external resource.
            - `USER_MESSAGE_QUEUE_FULL`: the running turn's queue, or the child's inbox, already holds `PEEN_MAX_QUEUED_USER_MESSAGES` messages.
            - `SESSION_BUSY`: the message carries `outputSchema` or `timeoutSeconds`, which need a new turn, while the session already has one running.
            - `AGENT_FINISHED`: the child agent named by `to` has already ended.
            - `AGENT_NOT_FOUND`: the session has no child agent run with the ID `to` names.
            - `AGENT_PAUSED`: deprecated and no longer sent, because a message to a paused child now resumes it.
            - `HARNESS_CONFIGURATION_INVALID`: Peen could not start the turn because the workspace agent configuration is invalid. `reason` says what to fix.
            - `TURN_ROUND_LIMIT`: the turn used all `PEEN_MAX_TOOL_ROUNDS` model rounds.
            - `TURN_TOKEN_LIMIT`: the turn billed `PEEN_MAX_TURN_TOKENS` tokens.
          enum:
            - VALIDATION_FAILED
            - INTERNAL_SERVER_ERROR
            - SESSION_NOT_FOUND
            - TURN_CANCELLED
            - TURN_TIMEOUT
            - OUTPUT_SCHEMA_INVALID
            - USER_MESSAGE_QUEUE_FULL
            - SESSION_BUSY
            - AGENT_FINISHED
            - AGENT_NOT_FOUND
            - AGENT_PAUSED
            - HARNESS_CONFIGURATION_INVALID
            - TURN_ROUND_LIMIT
            - TURN_TOKEN_LIMIT
        message:
          type: string
          description: >-
            A sentence for the sender. For `VALIDATION_FAILED` it is either a
            specific sentence written for the sender, such as
            `message.send requires an id` or which image or size limit was
            refused, or the generic `websocket message rejected`; for
            `INTERNAL_SERVER_ERROR` it is `websocket message failed`. For
            `TURN_ROUND_LIMIT` and `TURN_TOKEN_LIMIT` it names the setting that
            stopped the turn.
        reason:
          type: string
          description: >-
            Set only alongside `HARNESS_CONFIGURATION_INVALID`. One of seven
            fixed sentences naming what is wrong with the workspace agent
            configuration and how to fix it: an invalid skill directory, invalid
            instructions or rules, an invalid named-agent document, invalid
            hooks or event handlers, too many or too large configuration files,
            unreadable configuration files, or a system prompt over
            `PEEN_MAX_SYSTEM_PROMPT_PERCENT` of the model's context window.

    MessageFailed:
      title: MessageFailed
      type: object
      additionalProperties: false
      required: [id, type, data, timestamp, metadata]
      description: |-
        The failed end of one `message.send` submission. A live acknowledgement: Peen does not store it, gives it no `metadata.sequence`, and never replays it through `GET /api/v1/session/feed`.

        Who receives it depends on where the message failed. A frame that carried no `id`, or that did not decode at all (not valid JSON, an `id` that is not a UUID string, or a field of the wrong type), gets a `message.failed` on the sending socket only, with a null `triggeredBy` and no `metadata.sessionId`, and the connection stays open. A message Peen could not route to a session gets a `message.failed` on the sending socket only, with no `metadata.sessionId`. A message whose `data` failed to decode also reaches only the sending socket, with `metadata.sessionId` set. Every later failure, such as an unknown session, a refused setting, or a turn that failed, was stopped, or timed out, reaches every socket watching the session, so match `triggeredBy` against the frame IDs you sent. A turn that fails after it started also stores its own `turn.failed` or `turn.cancelled` frame, and this acknowledgement's order relative to that frame is not guaranteed.
      properties:
        id:
          type: string
          format: uuid
          description: >-
            A random UUID Peen generates for this acknowledgement. It is not
            stored and is never replayed.
        type:
          type: string
          const: message.failed
          description: The frame type, `message.failed`.
        data:
          $ref: "#/components/schemas/MessageFailedData"
        timestamp:
          type: integer
          format: int64
          description: When Peen sent the frame, in Unix seconds.
        metadata:
          $ref: "#/components/schemas/Metadata"
        triggeredBy:
          type: [string, "null"]
          format: uuid
          description: >-
            The `id` of the `message.send` frame this frame answers. Match it
            against the IDs you sent to find the answer to your own message,
            since other sockets watching the session receive it too. `null`
            when the failed frame carried no `id`.

    # Anthropic Messages-shaped stream blocks. Field names stay snake_case:
    # Peen does not own this format.

    ContentBlockTextStart:
      title: ContentBlockTextStart
      type: object
      additionalProperties: false
      required: [type]
      description: >-
        Opens a block of the model's reply text, in a `content_block_start`
        frame. Peen opens a text block only when the model writes text in that
        round, so it never sends an empty one.
      properties:
        type:
          type: string
          const: text
          description: Always `text`.
        text:
          type: string
          description: Peen never sets this at block start.

    ContentBlockThinkingStart:
      title: ContentBlockThinkingStart
      type: object
      additionalProperties: false
      required: [type]
      description: >-
        Opens a block of the model's reasoning, in a `content_block_start`
        frame. A round's thinking block, when it has one, closes before that
        round's text block opens.
      properties:
        type:
          type: string
          const: thinking
          description: Always `thinking`.
        text:
          type: string
          description: Peen never sets this at block start.

    ContentBlockToolUseStart:
      title: ContentBlockToolUseStart
      type: object
      additionalProperties: false
      required: [type, id, name, input]
      description: >-
        Opens the block for one tool call the model made, in a
        `content_block_start` frame. One `input_json_delta` with the call's
        arguments and a `content_block_stop` follow at once. Peen sends the
        root `tool.use` frame for the same call right before this block.
      properties:
        type:
          type: string
          const: tool_use
          description: Always `tool_use`.
        id:
          type: string
          description: >-
            The tool call ID, the same as `callId` on the matching `tool.use`
            and `tool.result` frames. The `tool_result` block that answers this
            call carries it as `tool_use_id`.
        name:
          type: string
          description: The name of the tool the model called.
        input:
          title: ContentBlockToolUseStartInput
          type: object
          description: Open. Always `{}` at block start.

    ContentBlockToolResultStart:
      title: ContentBlockToolResultStart
      type: object
      additionalProperties: false
      required: [type, tool_use_id]
      description: >-
        Opens the block for one tool call's result, in a `content_block_start`
        frame. One `json_partial` delta with the whole result text and a
        `content_block_stop` follow at once. Peen sends the root `tool.result`
        frame for the same call right before this block.
      properties:
        type:
          type: string
          const: tool_result
          description: Always `tool_result`.
        tool_use_id:
          type: string
          description: The `id` of the `tool_use` block this result answers.
        is_error:
          type: boolean
          description: Present only when `true`.

    ContentBlockStartData:
      title: ContentBlockStartData
      type: object
      additionalProperties: false
      required: [type, index, content_block]
      description: >-
        The `data` of a `content_block_start` frame, shaped like the Anthropic
        Messages stream event of the same name. Field names stay snake_case
        because Peen does not own this format.
      properties:
        type:
          type: string
          const: content_block_start
          description: Always `content_block_start`, the same as the frame's `type`.
        index:
          type: integer
          minimum: 0
          description: >-
            The block's index within the turn. Indexes start at 0 for each turn
            and never repeat inside it, so key blocks by `metadata.requestId`
            and `index`. After a round's thinking and text blocks, the round's
            tool calls take the next indexes in call order, and their result
            blocks take the indexes after those, so a result block's index is
            known before the result arrives.
        content_block:
          title: ContentBlock
          description: >-
            The block being opened. `type` selects the shape: `text`,
            `thinking`, `tool_use`, or `tool_result`.
          discriminator: type
          oneOf:
            - $ref: "#/components/schemas/ContentBlockTextStart"
            - $ref: "#/components/schemas/ContentBlockThinkingStart"
            - $ref: "#/components/schemas/ContentBlockToolUseStart"
            - $ref: "#/components/schemas/ContentBlockToolResultStart"

    ContentBlockStart:
      title: ContentBlockStart
      type: object
      additionalProperties: false
      required: [id, type, data, timestamp, metadata]
      description: >-
        Opens content block `data.index` of the model's reply. Peen emits it as
        the model streams. Text and thinking blocks open on their first
        fragment; tool blocks open when the call starts and when its result
        arrives. Deltas for the block follow, and a `content_block_stop` with
        the same index closes it. When a turn resumes after an interruption,
        Peen first closes any block the interruption left open. Peen stores the
        frame before it sends it, gives it a `metadata.sequence`, and sends it
        to every socket that is not filtered and to every socket filtered to
        its session. `GET /api/v1/session/feed` replays it with the same `id`,
        `timestamp`, and data.
      properties:
        id:
          type: string
          format: uuid
          description: >-
            The ID of the stored record this frame renders. It is the same live
            and on replay through `GET /api/v1/session/feed`, so you can use it
            to skip a frame you already applied.
        type:
          type: string
          const: content_block_start
          description: >-
            The frame type, `content_block_start`. Switch on it to read `data`.
        data:
          $ref: "#/components/schemas/ContentBlockStartData"
        timestamp:
          type: integer
          format: int64
          description: >-
            When Peen stored the record, in Unix seconds. It is the same live
            and on replay, so it does not tell you which path delivered the
            frame.
        metadata:
          $ref: "#/components/schemas/Metadata"
        triggeredBy:
          type: [string, "null"]
          format: uuid
          description: >-
            Always `null` on a stored frame, because Peen renders it from the
            stored record the same way live and on replay. Correlate stored
            frames through `metadata.requestId` instead.

    TextDelta:
      title: TextDelta
      type: object
      additionalProperties: false
      required: [type, text]
      description: >-
        A fragment of the model's reply text, in a `content_block_delta` frame
        for a `text` block.
      properties:
        type:
          type: string
          const: text_delta
          description: Always `text_delta`.
        text:
          type: string
          description: >-
            The fragment, never empty. Append it to the block's earlier
            fragments.

    ThinkingDelta:
      title: ThinkingDelta
      type: object
      additionalProperties: false
      required: [type, text]
      description: >-
        A fragment of the model's reasoning, in a `content_block_delta` frame
        for a `thinking` block.
      properties:
        type:
          type: string
          const: thinking_delta
          description: Always `thinking_delta`.
        text:
          type: string
          description: >-
            The fragment, never empty. Append it to the block's earlier
            fragments.

    InputJSONDelta:
      title: InputJSONDelta
      type: object
      additionalProperties: false
      required: [type, partial_json]
      description: >-
        The arguments of a tool call, in the `content_block_delta` frame of a
        `tool_use` block. Peen sends the whole arguments document in one delta,
        so each `tool_use` block has exactly one.
      properties:
        type:
          type: string
          const: input_json_delta
          description: Always `input_json_delta`.
        partial_json:
          type: string
          description: >-
            Free text. The tool call's arguments as the JSON text the provider
            returned. Peen sends the whole document here, though a client that
            concatenates every `input_json_delta` of a block gets the same
            result.

    JSONPartialDelta:
      title: JSONPartialDelta
      type: object
      additionalProperties: false
      required: [type, text]
      description: >-
        The result of a tool call, in the `content_block_delta` frame of a
        `tool_result` block. Peen sends the whole result in one delta, so each
        `tool_result` block has exactly one.
      properties:
        type:
          type: string
          const: json_partial
          description: Always `json_partial`.
        text:
          type: string
          description: >-
            Free text. The tool's result text, the same as `content` on the
            matching `tool.result` frame. It is not necessarily JSON.

    ContentBlockDeltaData:
      title: ContentBlockDeltaData
      type: object
      additionalProperties: false
      required: [type, index, delta]
      description: >-
        The `data` of a `content_block_delta` frame, shaped like the Anthropic
        Messages stream event of the same name.
      properties:
        type:
          type: string
          const: content_block_delta
          description: Always `content_block_delta`, the same as the frame's `type`.
        index:
          type: integer
          minimum: 0
          description: The index of the open block this delta appends to.
        delta:
          title: Delta
          description: >-
            The fragment to append. `type` selects the shape: `text_delta`,
            `thinking_delta`, `input_json_delta`, or `json_partial`.
          discriminator: type
          oneOf:
            - $ref: "#/components/schemas/TextDelta"
            - $ref: "#/components/schemas/ThinkingDelta"
            - $ref: "#/components/schemas/InputJSONDelta"
            - $ref: "#/components/schemas/JSONPartialDelta"

    ContentBlockDelta:
      title: ContentBlockDelta
      type: object
      additionalProperties: false
      required: [id, type, data, timestamp, metadata]
      description: >-
        Appends to open content block `data.index`. To render a live reply,
        fold a turn's deltas in arrival order: append `text_delta` and
        `thinking_delta` text to their block, and attach each tool block to its
        call. Peen writes deltas in short batches, so they can arrive in
        bursts. Peen stores the frame before it sends it, gives it a
        `metadata.sequence`, and sends it to every socket that is not filtered
        and to every socket filtered to its session.
        `GET /api/v1/session/feed` replays it with the same `id`, `timestamp`,
        and data.
      properties:
        id:
          type: string
          format: uuid
          description: >-
            The ID of the stored record this frame renders. It is the same live
            and on replay through `GET /api/v1/session/feed`, so you can use it
            to skip a frame you already applied.
        type:
          type: string
          const: content_block_delta
          description: >-
            The frame type, `content_block_delta`. Switch on it to read `data`.
        data:
          $ref: "#/components/schemas/ContentBlockDeltaData"
        timestamp:
          type: integer
          format: int64
          description: >-
            When Peen stored the record, in Unix seconds. It is the same live
            and on replay, so it does not tell you which path delivered the
            frame.
        metadata:
          $ref: "#/components/schemas/Metadata"
        triggeredBy:
          type: [string, "null"]
          format: uuid
          description: >-
            Always `null` on a stored frame, because Peen renders it from the
            stored record the same way live and on replay. Correlate stored
            frames through `metadata.requestId` instead.

    ContentBlockStopData:
      title: ContentBlockStopData
      type: object
      additionalProperties: false
      required: [type, index]
      description: The `data` of a `content_block_stop` frame.
      properties:
        type:
          type: string
          const: content_block_stop
          description: Always `content_block_stop`, the same as the frame's `type`.
        index:
          type: integer
          minimum: 0
          description: The index of the block that closed.

    ContentBlockStop:
      title: ContentBlockStop
      type: object
      additionalProperties: false
      required: [id, type, data, timestamp, metadata]
      description: >-
        Closes content block `data.index`. No more deltas arrive for that index
        in this turn. When the turn ends, its messages are stored and
        `GET /api/v1/messages` returns the finished reply. Peen stores the
        frame before it sends it, gives it a `metadata.sequence`, and sends it
        to every socket that is not filtered and to every socket filtered to
        its session. `GET /api/v1/session/feed` replays it with the same `id`,
        `timestamp`, and data.
      properties:
        id:
          type: string
          format: uuid
          description: >-
            The ID of the stored record this frame renders. It is the same live
            and on replay through `GET /api/v1/session/feed`, so you can use it
            to skip a frame you already applied.
        type:
          type: string
          const: content_block_stop
          description: >-
            The frame type, `content_block_stop`. Switch on it to read `data`.
        data:
          $ref: "#/components/schemas/ContentBlockStopData"
        timestamp:
          type: integer
          format: int64
          description: >-
            When Peen stored the record, in Unix seconds. It is the same live
            and on replay, so it does not tell you which path delivered the
            frame.
        metadata:
          $ref: "#/components/schemas/Metadata"
        triggeredBy:
          type: [string, "null"]
          format: uuid
          description: >-
            Always `null` on a stored frame, because Peen renders it from the
            stored record the same way live and on replay. Correlate stored
            frames through `metadata.requestId` instead.

    # Root turn and session events.

    TurnStartedData:
      title: TurnStartedData
      type: object
      additionalProperties: false
      required: [sessionId, model, workspace]
      description: >-
        The `data` of a `turn.started` frame. `originEventId` and
        `originEventType` are present only on a turn that a session event
        started.
      properties:
        sessionId:
          type: string
          format: uuid
          description: The session the turn runs in.
        model:
          type: string
          description: >-
            The model the turn runs on, as `provider/model`: the message's
            `model`, or the deployment default.
        workspace:
          type: string
          description: >-
            The session's workspace directory, the canonical path the session
            was opened with.
        originEventId:
          type: string
          format: uuid
          description: >-
            The ID of the session notice whose event handler started this turn.
            Absent on a turn a message started.
        originEventType:
          type: string
          description: >-
            The event type of that notice, such as `ci.build.failed`. Absent on
            a turn a message started.

    TurnStarted:
      title: TurnStarted
      type: object
      additionalProperties: false
      required: [id, type, data, timestamp, metadata]
      description: |-
        The turn is set up and about to make its first model call. Peen emits it once per turn, after the frames that open the turn and before the first content block.

        The frames of one turn arrive in sequence order, and every frame of the turn carries the turn's `metadata.requestId`. A turn's frames arrive in this order:

        1. `userMessage.created`
        2. one `skill.injected` per forced skill
        3. `session.events` when notices were waiting
        4. `harness.warning` when Peen ignored harness files
        5. `mcp.status`
        6. `turn.started`
        7. the model rounds, each one made of content blocks, `tool.use` and `tool.result` frames, `provider.retry`, `session.events` delivered at tool boundaries, `question.asked` and `question.answered`, and the `userMessage.*` and `skill.injected` frames of queued messages
        8. exactly one terminal frame, `turn.completed`, `turn.failed`, or `turn.cancelled`

        `agent.run.*` and `notice.created` frames of the same session interleave in the same feed. The `message.completed` or `message.failed` that answers the submission is sent on a separate, unstored path, so do not rely on where it falls relative to the turn's stored frames.

        Peen stores the frame before it sends it, gives it a `metadata.sequence`, and sends it to every socket that is not filtered and to every socket filtered to its session. `GET /api/v1/session/feed` replays it with the same `id`, `timestamp`, and data.
      properties:
        id:
          type: string
          format: uuid
          description: >-
            The ID of the stored record this frame renders. It is the same live
            and on replay through `GET /api/v1/session/feed`, so you can use it
            to skip a frame you already applied.
        type:
          type: string
          const: turn.started
          description: The frame type, `turn.started`. Switch on it to read `data`.
        data:
          $ref: "#/components/schemas/TurnStartedData"
        timestamp:
          type: integer
          format: int64
          description: >-
            When Peen stored the record, in Unix seconds. It is the same live
            and on replay, so it does not tell you which path delivered the
            frame.
        metadata:
          $ref: "#/components/schemas/Metadata"
        triggeredBy:
          type: [string, "null"]
          format: uuid
          description: >-
            Always `null` on a stored frame, because Peen renders it from the
            stored record the same way live and on replay. Correlate stored
            frames through `metadata.requestId` instead.

    UserMessageCreated:
      title: UserMessageCreated
      type: object
      additionalProperties: false
      required: [id, type, data, timestamp, metadata]
      description: >-
        Peen accepted a user message. Every accepted `message.send` produces
        one, and so does every other turn start, such as a turn an event
        handler started. It is the first frame of a turn the message starts.
        For a message that joins a running turn it arrives among that turn's
        frames, carrying the queued message's own `metadata.requestId`, and
        `userMessage.queued` follows it. Peen stores the frame before it sends
        it, gives it a `metadata.sequence`, and sends it to every socket that
        is not filtered and to every socket filtered to its session.
        `GET /api/v1/session/feed` replays it with the same `id`, `timestamp`,
        and data.
      properties:
        id:
          type: string
          format: uuid
          description: >-
            The ID of the stored record this frame renders. It is the same live
            and on replay through `GET /api/v1/session/feed`, so you can use it
            to skip a frame you already applied.
        type:
          type: string
          const: userMessage.created
          description: >-
            The frame type, `userMessage.created`. Switch on it to read `data`.
        data:
          $ref: "#/components/schemas/UserMessage"
        timestamp:
          type: integer
          format: int64
          description: >-
            When Peen stored the record, in Unix seconds. It is the same live
            and on replay, so it does not tell you which path delivered the
            frame.
        metadata:
          $ref: "#/components/schemas/Metadata"
        triggeredBy:
          type: [string, "null"]
          format: uuid
          description: >-
            Always `null` on a stored frame, because Peen renders it from the
            stored record the same way live and on replay. Correlate stored
            frames through `metadata.requestId` instead.

    UserMessageQueued:
      title: UserMessageQueued
      type: object
      additionalProperties: false
      required: [id, type, data, timestamp, metadata]
      description: >-
        An accepted message joined the running turn's queue. It follows that
        message's `userMessage.created` and carries the queued message's own
        `metadata.requestId`. The message reaches the model when the running
        turn's current model round ends, after every tool call in that round
        has finished, and `userMessage.delivered` reports that. Peen stores the
        frame before it sends it, gives it a `metadata.sequence`, and sends it
        to every socket that is not filtered and to every socket filtered to
        its session. `GET /api/v1/session/feed` replays it with the same `id`,
        `timestamp`, and data.
      properties:
        id:
          type: string
          format: uuid
          description: >-
            The ID of the stored record this frame renders. It is the same live
            and on replay through `GET /api/v1/session/feed`, so you can use it
            to skip a frame you already applied.
        type:
          type: string
          const: userMessage.queued
          description: >-
            The frame type, `userMessage.queued`. Switch on it to read `data`.
        data:
          $ref: "#/components/schemas/UserMessage"
        timestamp:
          type: integer
          format: int64
          description: >-
            When Peen stored the record, in Unix seconds. It is the same live
            and on replay, so it does not tell you which path delivered the
            frame.
        metadata:
          $ref: "#/components/schemas/Metadata"
        triggeredBy:
          type: [string, "null"]
          format: uuid
          description: >-
            Always `null` on a stored frame, because Peen renders it from the
            stored record the same way live and on replay. Correlate stored
            frames through `metadata.requestId` instead.

    UserMessageDelivered:
      title: UserMessageDelivered
      type: object
      additionalProperties: false
      required: [id, type, data, timestamp, metadata]
      description: >-
        A queued message reached the model. It carries the queued message's own
        `metadata.requestId`, so it pairs with that message's
        `userMessage.queued`. Queued messages are delivered in the order they
        were sent, one `userMessage.delivered` per message, followed by one
        `skill.injected` per skill message that came with it. Its `data` has no
        `images`. A queued message that never got a delivery frame is not
        necessarily lost: Peen keeps accepted messages until delivery. Peen
        stores the frame before it sends it, gives it a `metadata.sequence`,
        and sends it to every socket that is not filtered and to every socket
        filtered to its session. `GET /api/v1/session/feed` replays it with the
        same `id`, `timestamp`, and data.
      properties:
        id:
          type: string
          format: uuid
          description: >-
            The ID of the stored record this frame renders. It is the same live
            and on replay through `GET /api/v1/session/feed`, so you can use it
            to skip a frame you already applied.
        type:
          type: string
          const: userMessage.delivered
          description: >-
            The frame type, `userMessage.delivered`. Switch on it to read
            `data`.
        data:
          $ref: "#/components/schemas/UserMessage"
        timestamp:
          type: integer
          format: int64
          description: >-
            When Peen stored the record, in Unix seconds. It is the same live
            and on replay, so it does not tell you which path delivered the
            frame.
        metadata:
          $ref: "#/components/schemas/Metadata"
        triggeredBy:
          type: [string, "null"]
          format: uuid
          description: >-
            Always `null` on a stored frame, because Peen renders it from the
            stored record the same way live and on replay. Correlate stored
            frames through `metadata.requestId` instead.

    SkillInjectedData:
      title: SkillInjectedData
      type: object
      additionalProperties: false
      required: [name, content]
      description: The `data` of a `skill.injected` frame.
      properties:
