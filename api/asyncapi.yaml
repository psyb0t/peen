        event:
          $ref: "#/components/schemas/TextPayload"

    AgentRunTextDelta:
      title: AgentRunTextDelta
      type: object
      additionalProperties: false
      required: [id, type, data, timestamp, metadata]
      description: >-
        One fragment of a child's reply text as the model streams it. Append
