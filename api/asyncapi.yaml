        - $ref: "#/components/schemas/MCPStatus"
        - $ref: "#/components/schemas/QuestionAskedEvent"
        - $ref: "#/components/schemas/QuestionAnsweredEvent"
        - $ref: "#/components/schemas/TurnCompleted"
        - $ref: "#/components/schemas/TurnFailed"
        - $ref: "#/components/schemas/TurnCancelled"
        - $ref: "#/components/schemas/NoticeCreated"
        - $ref: "#/components/schemas/AgentRunStarted"
        - $ref: "#/components/schemas/AgentRunTextDelta"
        - $ref: "#/components/schemas/AgentRunThinkingDelta"
        - $ref: "#/components/schemas/AgentRunToolUse"
        - $ref: "#/components/schemas/AgentRunToolResult"
