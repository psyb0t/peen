    Part:
      title: Part
      type: object
      additionalProperties: false
      required: [type]
      description: >-
        One part of a child's assistant message content, in order. A child's
        reply holds only `text` parts; `image`, `audio`, and `file` exist for
        parity with the model layer's content format and are open objects that
        Peen does not define as a contract.
      properties:
        type:
          title: PartType
          type: string
          enum: [text, image, audio, file]
          description: |-
            Which kind of part this is, and so which other property is set:

            - `text`: a run of text, in `text`.
            - `image`: an image, in `image`.
            - `audio`: an audio clip, in `audio`.
            - `file`: a file, in `file`.
        text:
          type: string
          description: The text of a `text` part. Absent on other parts.
        image:
          title: PartImage
          type: object
          description: The media source of an `image` part. Open.
        audio:
          title: PartAudio
          type: object
          description: The media source of an `audio` part. Open.
        file:
          title: PartFile
          type: object
          description: The media source of a `file` part. Open.

