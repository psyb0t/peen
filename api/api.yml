openapi: 3.1.0
info:
  title: Peen API
  version: 1.0.0
  description: Stateful agent sessions with durable SQLite reads and WebSocket turns.
servers:
  - url: /v1
security:
  - bearerAuth: []
  - {}
paths:
  /messages:
    get:
      operationId: listMessages
      summary: List stored conversation messages
      parameters:
        - $ref: '#/components/parameters/SessionIDRequired'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Message page
          headers:
            X-Session-ID:
              $ref: '#/components/headers/SessionID'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorInternal'
  /session:
    get:
      operationId: getSession
      summary: Read session details
      parameters:
        - $ref: '#/components/parameters/SessionIDRequired'
      responses:
        '200':
          description: Session details
          headers:
            X-Session-ID:
              $ref: '#/components/headers/SessionID'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorInternal'
  /session/cancel:
    post:
      operationId: cancelSession
      summary: Request cancellation for the active turn
      parameters:
        - $ref: '#/components/parameters/SessionIDRequired'
      responses:
        '202':
          description: Cancellation request accepted
          headers:
            X-Session-ID:
              $ref: '#/components/headers/SessionID'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelResponse'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorInternal'
  /session/events:
    get:
      operationId: listSessionEvents
      summary: List durable protocol events
      parameters:
        - $ref: '#/components/parameters/SessionIDRequired'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Durable protocol event page
          headers:
            X-Session-ID:
              $ref: '#/components/headers/SessionID'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptEventPage'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorInternal'
  /session/notices:
    get:
      operationId: listSessionNotices
      summary: List durable outside and worker notices
      parameters:
        - $ref: '#/components/parameters/SessionIDRequired'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Notice page
          headers:
            X-Session-ID:
              $ref: '#/components/headers/SessionID'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionNoticePage'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorInternal'
    post:
      operationId: publishSessionNotice
      summary: Report a durable notice to the session
      parameters:
        - $ref: '#/components/parameters/SessionIDRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionNoticeRequest'
      responses:
        '202':
          description: Notice accepted
          headers:
            X-Session-ID:
              $ref: '#/components/headers/SessionID'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionNotice'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorInternal'
  /session/jobs:
    get:
      operationId: listSessionJobs
      summary: List the commands this session has started
      parameters:
        - $ref: '#/components/parameters/SessionIDRequired'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [running, exited, signalled, failed, interrupted]
      responses:
        '200':
          description: Process jobs
          headers:
            X-Session-ID:
              $ref: '#/components/headers/SessionID'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPage'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorInternal'
  /session/jobs/{jobId}/output:
    get:
      operationId: readSessionJobOutput
      summary: Read a bounded window of one job's output
      parameters:
        - $ref: '#/components/parameters/SessionIDRequired'
        - $ref: '#/components/parameters/JobID'
        - name: stream
          in: query
          required: false
          schema:
            type: string
            enum: [stdout, stderr, both]
            default: both
        - name: cursor
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 2000
            default: 500
      responses:
        '200':
          description: Job output window
          headers:
            X-Session-ID:
              $ref: '#/components/headers/SessionID'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOutput'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorInternal'
  /session/jobs/{jobId}/signals:
    get:
      operationId: listSessionJobSignalRequests
      summary: List the durable signal-request history for one job
      parameters:
        - $ref: '#/components/parameters/SessionIDRequired'
        - $ref: '#/components/parameters/JobID'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Job signal-request page
          headers:
            X-Session-ID:
              $ref: '#/components/headers/SessionID'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSignalRecordPage'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorInternal'
  /session/jobs/{jobId}/signal:
    post:
      operationId: signalSessionJob
      summary: Stop one running job
      parameters:
        - $ref: '#/components/parameters/SessionIDRequired'
        - $ref: '#/components/parameters/JobID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobSignalRequest'
      responses:
        '202':
          description: Signal accepted
          headers:
            X-Session-ID:
              $ref: '#/components/headers/SessionID'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSignalResponse'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorInternal'
  /session/agents:
    get:
      operationId: listSessionAgentRuns
      summary: List the child agent runs this session has started
      parameters:
        - $ref: '#/components/parameters/SessionIDRequired'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [running, completed, failed, cancelled]
      responses:
        '200':
          description: Agent runs
          headers:
            X-Session-ID:
              $ref: '#/components/headers/SessionID'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRunPage'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorInternal'
  /session/turns:
    get:
      operationId: listSessionTurns
      summary: List durable turns
      parameters:
        - $ref: '#/components/parameters/SessionIDRequired'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Turn page
          headers:
            X-Session-ID:
              $ref: '#/components/headers/SessionID'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnPage'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorInternal'
  /session/compactions:
    get:
      operationId: listSessionCompactions
      summary: List durable compaction records
      parameters:
        - $ref: '#/components/parameters/SessionIDRequired'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Compaction page
          headers:
            X-Session-ID:
              $ref: '#/components/headers/SessionID'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompactionPage'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorInternal'
  /session/compactions/{compactionId}:
    get:
      operationId: getSessionCompaction
      summary: Read one durable compaction record
      parameters:
        - $ref: '#/components/parameters/SessionIDRequired'
        - $ref: '#/components/parameters/CompactionID'
      responses:
        '200':
          description: Compaction record
          headers:
            X-Session-ID:
              $ref: '#/components/headers/SessionID'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Compaction'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorInternal'
  /session/model-runs:
    get:
      operationId: listSessionModelRuns
      summary: List complete durable model invocations
      parameters:
        - $ref: '#/components/parameters/SessionIDRequired'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: stage
          in: query
          required: false
          schema:
            type: string
            enum: [turn, child, compaction]
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [running, completed, failed, cancelled, interrupted]
      responses:
        '200':
          description: Model invocation page
          headers:
            X-Session-ID:
              $ref: '#/components/headers/SessionID'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelRunPage'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorInternal'
  /session/model-runs/{modelRunId}/calls:
    get:
      operationId: listSessionModelRunCalls
      summary: Read every provider round for one model invocation
      parameters:
        - $ref: '#/components/parameters/SessionIDRequired'
        - $ref: '#/components/parameters/ModelRunID'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Provider round page
          headers:
            X-Session-ID:
              $ref: '#/components/headers/SessionID'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelCallPage'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorInternal'
  /session/context-snapshots/{contextHash}:
    get:
      operationId: getSessionContextSnapshot
      summary: Read a context snapshot referenced by this session
      parameters:
        - $ref: '#/components/parameters/SessionIDRequired'
        - $ref: '#/components/parameters/ContextHash'
      responses:
        '200':
          description: Context snapshot
          headers:
            X-Session-ID:
              $ref: '#/components/headers/SessionID'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextSnapshot'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorInternal'
  /session/prompt-snapshots/{promptHash}:
    get:
      operationId: getSessionPromptSnapshot
      summary: Read a prompt snapshot referenced by this session
      parameters:
        - $ref: '#/components/parameters/SessionIDRequired'
        - $ref: '#/components/parameters/PromptHash'
      responses:
        '200':
          description: Prompt snapshot
          headers:
            X-Session-ID:
              $ref: '#/components/headers/SessionID'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptSnapshot'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorInternal'
  /session/agents/{agentRunId}:
    get:
      operationId: getSessionAgentRun
      summary: Read one durable child agent run
      parameters:
        - $ref: '#/components/parameters/SessionIDRequired'
        - $ref: '#/components/parameters/AgentRunID'
      responses:
        '200':
          description: Child agent run
          headers:
            X-Session-ID:
              $ref: '#/components/headers/SessionID'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorInternal'
  /session/agents/{agentRunId}/events:
    get:
      operationId: listSessionAgentRunEvents
      summary: Follow what one child agent run is doing
      parameters:
        - $ref: '#/components/parameters/SessionIDRequired'
        - $ref: '#/components/parameters/AgentRunID'
        - name: cursor
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
            default: 100
      responses:
        '200':
          description: Agent run events
          headers:
            X-Session-ID:
              $ref: '#/components/headers/SessionID'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRunEventPage'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorInternal'
  /session/agents/{agentRunId}/cancel:
    post:
      operationId: cancelSessionAgentRun
      summary: Cancel one child agent run without ending its parent turn
      parameters:
        - $ref: '#/components/parameters/SessionIDRequired'
        - $ref: '#/components/parameters/AgentRunID'
      responses:
        '202':
          description: Cancellation request accepted
          headers:
            X-Session-ID:
              $ref: '#/components/headers/SessionID'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRunCancelResponse'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorInternal'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
  headers:
    SessionID:
      description: Created or resumed session UUID.
      required: true
      schema:
        type: string
        format: uuid
    RequestID:
      description: Request correlation UUID.
      required: true
      schema:
        type: string
        format: uuid
  parameters:
    SessionIDOptional:
      name: X-Session-ID
      in: header
      required: false
      schema:
        type: string
        format: uuid
    SessionIDRequired:
      name: X-Session-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
    AgentRunID:
      name: agentRunId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CompactionID:
      name: compactionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ModelRunID:
      name: modelRunId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ContextHash:
      name: contextHash
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    PromptHash:
      name: promptHash
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    JobID:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 50
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Order:
      name: order
      in: query
      required: false
      schema:
        type: string
        enum: [asc, desc]
        default: asc
  responses:
    ErrorBadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ErrorUnauthorized:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ErrorNotFound:
      description: Session not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ErrorConflict:
      description: Turn cannot run in its current state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ErrorInternal:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Message:
      type: object
      additionalProperties: false
      required: [id, sequence, role, content, workspace, createdAt]
      properties:
        id:
          type: string
          format: uuid
        sequence:
          type: integer
          format: int64
          minimum: 1
        role:
          type: string
          enum: [user, assistant, tool]
        content:
          type: string
        workspace:
          type: string
        model:
          type: [string, 'null']
        thinking:
          type: [string, 'null']
        toolCalls:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/MessageToolCall'
        toolCallId:
          type: [string, 'null']
        isError:
          type: boolean
        incomplete:
          type: boolean
        compactionId:
          type: [string, 'null']
          format: uuid
        createdAt:
          type: string
          format: date-time
    MessageToolCall:
      type: object
      additionalProperties: false
      required: [id, name, arguments]
      properties:
        id:
          type: string
        name:
          type: string
        arguments:
          type: object
          additionalProperties: true
    MessagePage:
      type: object
      additionalProperties: false
      required: [items, limit, offset, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 200
        offset:
          type: integer
          format: int32
          minimum: 0
        hasMore:
          type: boolean
    Session:
      type: object
      additionalProperties: false
      required:
        [id, createdAt, updatedAt, messageCount, completedTurnCount, activeTurn, agent, model]
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastMessageAt:
          type: [string, 'null']
          format: date-time
        messageCount:
          type: integer
          format: int64
          minimum: 0
        completedTurnCount:
          type: integer
          format: int64
          minimum: 0
        activeTurn:
          type: boolean
        agent:
          type: string
        model:
          type: string
    CancelResponse:
      type: object
      additionalProperties: false
      required: [cancelRequested]
      properties:
        cancelRequested:
          type: boolean
    Turn:
      type: object
      additionalProperties: false
      required:
        [id, sessionId, requestId, workspace, state, cancelRequested, startedAt,
         failureClassification]
      properties:
        id:
