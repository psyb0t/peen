openapi: 3.1.0
info:
  title: Peen API
  version: 1.0.0
  description: Stateful agent sessions with durable SQLite reads and WebSocket turns.
servers:
  - url: /v1
security:
  - bearerAuth: []
  - {}
paths:
  /messages:
    get:
      operationId: listMessages
      summary: List stored conversation messages
      parameters:
        - $ref: '#/components/parameters/SessionIDRequired'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Message page
          headers:
            X-Session-ID:
              $ref: '#/components/headers/SessionID'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorInternal'
  /sessions:
    get:
      operationId: listSessions
      summary: List durable workspace sessions
      description: >
        Lists every session this control surface holds. It takes no session
        header because it is how a client discovers which sessions exist.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Session page
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionPage'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '500':
          $ref: '#/components/responses/ErrorInternal'
  /sessions/open:
    post:
      operationId: openSession
      summary: Open or resume the session for a workspace
      description: >
        Resolves a workspace path to its one durable session, creating that
        session the first time the directory is opened. This is the only
        operation that creates a session, so a control surface starts with none
        and a client must name the workspace it wants. Opening the same
        directory again, by any of its names, resumes the existing session. A
        path outside every configured workspace root is refused with 403 and no
        session is created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenSessionRequest'
      responses:
        '200':
          description: Session opened or resumed
          headers:
            X-Session-ID:
              $ref: '#/components/headers/SessionID'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenedSession'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '500':
          $ref: '#/components/responses/ErrorInternal'
  /execution-profiles:
    get:
      operationId: listExecutionProfiles
      summary: List the execution profiles a client may name
      description: >
        Lists the operator-defined profiles a session may run under. A client
        names a profile when it opens a workspace and never sends an image,
        mount, network setting, or capability. A profile that grants
        host-root-equivalent access carries a capability warning.
      responses:
        '200':
          description: Execution profile list
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionProfileList'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '500':
          $ref: '#/components/responses/ErrorInternal'
  /session/workers:
    get:
      operationId: listSessionWorkers
      summary: List one session's worker generations
      description: >
        Returns the durable worker generations for one session, newest first. A
        generation records the worker process that ran a set of turns, the
        profile revision it started under, and for a Docker generation its
        container and repository image digest when one is available.
      parameters:
        - $ref: '#/components/parameters/SessionIDRequired'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Worker generation page
          headers:
            X-Session-ID:
              $ref: '#/components/headers/SessionID'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerGenerationPage'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorInternal'
  /session/reconfigure:
    post:
      operationId: reconfigureSession
      summary: Move an idle session to a different execution profile
      description: >
        Changes the operator-defined profile a session's tools run under and
        records the decision with the caller's reason. The named profile must
        be one the operator defined; an undefined name is refused with 403. A
        session with a turn in flight is refused with 409, because changing the
        environment under running work would attribute that turn's tool calls
        to a profile that did not run them. On success the session's current
        worker is stopped, so the next turn starts a new generation under the
        new profile. The client names only a profile and never sends an image,
        mount, network setting, or capability.
      parameters:
        - $ref: '#/components/parameters/SessionIDRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconfigureSessionRequest'
      responses:
        '200':
          description: Execution profile changed
          headers:
            X-Session-ID:
              $ref: '#/components/headers/SessionID'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionProfileDecision'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '409':
          $ref: '#/components/responses/ErrorConflict'
        '500':
          $ref: '#/components/responses/ErrorInternal'
  /session/profile-decisions:
    get:
      operationId: listSessionProfileDecisions
      summary: List one session's execution profile decision history
      description: >
        Returns the durable record of every execution profile change made to
        one session, newest first. Each entry names the profile the session
        moved from, the profile it moved to, and the reason the caller gave.
      parameters:
        - $ref: '#/components/parameters/SessionIDRequired'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Execution profile decision page
          headers:
            X-Session-ID:
              $ref: '#/components/headers/SessionID'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionProfileDecisionPage'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorInternal'
  /session:
    get:
      operationId: getSession
      summary: Read session details
      parameters:
        - $ref: '#/components/parameters/SessionIDRequired'
      responses:
        '200':
          description: Session details
          headers:
            X-Session-ID:
              $ref: '#/components/headers/SessionID'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorInternal'
  /session/cancel:
    post:
      operationId: cancelSession
      summary: Request cancellation for the active turn
      parameters:
        - $ref: '#/components/parameters/SessionIDRequired'
      responses:
        '202':
          description: Cancellation request accepted
          headers:
            X-Session-ID:
              $ref: '#/components/headers/SessionID'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelResponse'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorInternal'
  /session/events:
    get:
      operationId: listSessionEvents
      summary: List durable protocol events
      parameters:
        - $ref: '#/components/parameters/SessionIDRequired'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Durable protocol event page
          headers:
            X-Session-ID:
              $ref: '#/components/headers/SessionID'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptEventPage'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorInternal'
  /session/notices:
    get:
      operationId: listSessionNotices
      summary: List durable outside and worker notices
      parameters:
        - $ref: '#/components/parameters/SessionIDRequired'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Notice page
          headers:
            X-Session-ID:
              $ref: '#/components/headers/SessionID'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionNoticePage'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorInternal'
    post:
      operationId: publishSessionNotice
      summary: Report a durable notice to the session
      parameters:
        - $ref: '#/components/parameters/SessionIDRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionNoticeRequest'
      responses:
        '202':
          description: Notice accepted
          headers:
            X-Session-ID:
              $ref: '#/components/headers/SessionID'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionNotice'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorInternal'
  /session/jobs:
    get:
      operationId: listSessionJobs
      summary: List the commands this session has started
      parameters:
        - $ref: '#/components/parameters/SessionIDRequired'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [running, exited, signalled, failed, interrupted]
      responses:
        '200':
          description: Process jobs
          headers:
            X-Session-ID:
              $ref: '#/components/headers/SessionID'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPage'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorInternal'
  /session/jobs/{jobId}/output:
    get:
      operationId: readSessionJobOutput
      summary: Read a bounded window of one job's output
      parameters:
        - $ref: '#/components/parameters/SessionIDRequired'
        - $ref: '#/components/parameters/JobID'
        - name: stream
          in: query
          required: false
          schema:
            type: string
            enum: [stdout, stderr, both]
            default: both
        - name: cursor
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 2000
            default: 500
      responses:
        '200':
          description: Job output window
          headers:
            X-Session-ID:
              $ref: '#/components/headers/SessionID'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOutput'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorInternal'
  /session/jobs/{jobId}/signals:
    get:
      operationId: listSessionJobSignalRequests
      summary: List the durable signal-request history for one job
      parameters:
        - $ref: '#/components/parameters/SessionIDRequired'
        - $ref: '#/components/parameters/JobID'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Job signal-request page
          headers:
            X-Session-ID:
              $ref: '#/components/headers/SessionID'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSignalRecordPage'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorInternal'
  /session/jobs/{jobId}/signal:
    post:
      operationId: signalSessionJob
      summary: Stop one running job
      parameters:
        - $ref: '#/components/parameters/SessionIDRequired'
        - $ref: '#/components/parameters/JobID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobSignalRequest'
      responses:
        '202':
          description: Signal accepted
          headers:
            X-Session-ID:
              $ref: '#/components/headers/SessionID'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSignalResponse'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorInternal'
  /session/agents:
    get:
      operationId: listSessionAgentRuns
      summary: List the child agent runs this session has started
      parameters:
        - $ref: '#/components/parameters/SessionIDRequired'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [running, completed, failed, cancelled]
      responses:
        '200':
          description: Agent runs
          headers:
            X-Session-ID:
              $ref: '#/components/headers/SessionID'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRunPage'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorInternal'
  /session/turns:
    get:
      operationId: listSessionTurns
      summary: List durable turns
      parameters:
        - $ref: '#/components/parameters/SessionIDRequired'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Turn page
          headers:
            X-Session-ID:
              $ref: '#/components/headers/SessionID'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnPage'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorInternal'
  /session/compactions:
    get:
      operationId: listSessionCompactions
      summary: List durable compaction records
      parameters:
        - $ref: '#/components/parameters/SessionIDRequired'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Compaction page
          headers:
            X-Session-ID:
              $ref: '#/components/headers/SessionID'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompactionPage'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorInternal'
  /session/compactions/{compactionId}:
    get:
      operationId: getSessionCompaction
      summary: Read one durable compaction record
      parameters:
        - $ref: '#/components/parameters/SessionIDRequired'
        - $ref: '#/components/parameters/CompactionID'
      responses:
        '200':
          description: Compaction record
          headers:
            X-Session-ID:
              $ref: '#/components/headers/SessionID'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Compaction'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorInternal'
  /session/model-runs:
    get:
      operationId: listSessionModelRuns
      summary: List complete durable model invocations
      parameters:
        - $ref: '#/components/parameters/SessionIDRequired'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: stage
          in: query
          required: false
          schema:
            type: string
            enum: [turn, child, compaction]
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [running, completed, failed, cancelled, interrupted]
      responses:
        '200':
          description: Model invocation page
          headers:
            X-Session-ID:
              $ref: '#/components/headers/SessionID'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelRunPage'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorInternal'
  /session/model-runs/{modelRunId}/calls:
    get:
      operationId: listSessionModelRunCalls
      summary: Read every provider round for one model invocation
      parameters:
        - $ref: '#/components/parameters/SessionIDRequired'
        - $ref: '#/components/parameters/ModelRunID'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Provider round page
          headers:
            X-Session-ID:
              $ref: '#/components/headers/SessionID'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelCallPage'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorInternal'
  /session/context-snapshots/{contextHash}:
    get:
      operationId: getSessionContextSnapshot
      summary: Read a context snapshot referenced by this session
      parameters:
        - $ref: '#/components/parameters/SessionIDRequired'
        - $ref: '#/components/parameters/ContextHash'
      responses:
        '200':
          description: Context snapshot
          headers:
            X-Session-ID:
              $ref: '#/components/headers/SessionID'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextSnapshot'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorInternal'
  /session/prompt-snapshots/{promptHash}:
    get:
      operationId: getSessionPromptSnapshot
      summary: Read a prompt snapshot referenced by this session
      parameters:
        - $ref: '#/components/parameters/SessionIDRequired'
        - $ref: '#/components/parameters/PromptHash'
      responses:
        '200':
          description: Prompt snapshot
          headers:
            X-Session-ID:
              $ref: '#/components/headers/SessionID'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptSnapshot'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorInternal'
  /session/agents/{agentRunId}:
    get:
      operationId: getSessionAgentRun
      summary: Read one durable child agent run
      parameters:
        - $ref: '#/components/parameters/SessionIDRequired'
        - $ref: '#/components/parameters/AgentRunID'
      responses:
        '200':
          description: Child agent run
          headers:
            X-Session-ID:
              $ref: '#/components/headers/SessionID'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorInternal'
  /session/agents/{agentRunId}/events:
    get:
      operationId: listSessionAgentRunEvents
      summary: Follow what one child agent run is doing
      parameters:
        - $ref: '#/components/parameters/SessionIDRequired'
        - $ref: '#/components/parameters/AgentRunID'
        - name: cursor
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
            default: 100
      responses:
        '200':
          description: Agent run events
          headers:
            X-Session-ID:
              $ref: '#/components/headers/SessionID'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRunEventPage'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorInternal'
  /session/agents/{agentRunId}/messages:
    get:
      operationId: listSessionAgentRunMessages
      summary: List one child agent run's own durable transcript
      description: >-
        A child agent runs a separate model context, so its transcript is
        stored apart from the session transcript and is never absorbed by a
        parent-session compaction.
      parameters:
        - $ref: '#/components/parameters/SessionIDRequired'
        - $ref: '#/components/parameters/AgentRunID'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Agent run message page
          headers:
            X-Session-ID:
              $ref: '#/components/headers/SessionID'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRunMessagePage'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorInternal'
  /session/agents/{agentRunId}/compactions:
    get:
      operationId: listSessionAgentRunCompactions
      summary: List one child agent run's compaction lineage
      parameters:
        - $ref: '#/components/parameters/SessionIDRequired'
        - $ref: '#/components/parameters/AgentRunID'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Agent run compaction page
          headers:
            X-Session-ID:
              $ref: '#/components/headers/SessionID'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRunCompactionPage'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorInternal'
  /session/agents/{agentRunId}/compactions/{compactionId}:
    get:
      operationId: getSessionAgentRunCompaction
      summary: Read one immutable child compaction record
      parameters:
        - $ref: '#/components/parameters/SessionIDRequired'
        - $ref: '#/components/parameters/AgentRunID'
        - $ref: '#/components/parameters/CompactionID'
      responses:
        '200':
          description: Agent run compaction record
          headers:
            X-Session-ID:
              $ref: '#/components/headers/SessionID'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRunCompaction'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorInternal'
  /session/agents/{agentRunId}/cancel:
    post:
      operationId: cancelSessionAgentRun
      summary: Cancel one child agent run without ending its parent turn
      parameters:
        - $ref: '#/components/parameters/SessionIDRequired'
        - $ref: '#/components/parameters/AgentRunID'
      responses:
        '202':
          description: Cancellation request accepted
          headers:
            X-Session-ID:
              $ref: '#/components/headers/SessionID'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRunCancelResponse'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorInternal'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
  headers:
    SessionID:
      description: Created or resumed session UUID.
      required: true
      schema:
        type: string
        format: uuid
    RequestID:
      description: Request correlation UUID.
      required: true
      schema:
        type: string
        format: uuid
  parameters:
    SessionIDOptional:
      name: X-Session-ID
      in: header
      required: false
      schema:
        type: string
        format: uuid
    SessionIDRequired:
      name: X-Session-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
    AgentRunID:
      name: agentRunId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CompactionID:
      name: compactionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ModelRunID:
      name: modelRunId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ContextHash:
      name: contextHash
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    PromptHash:
      name: promptHash
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    JobID:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 50
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Order:
      name: order
      in: query
      required: false
      schema:
        type: string
        enum: [asc, desc]
        default: asc
  responses:
    ErrorBadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ErrorUnauthorized:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ErrorForbidden:
      description: The request names a resource the deployment does not allow
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ErrorNotFound:
      description: Session not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ErrorConflict:
      description: Turn cannot run in its current state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ErrorInternal:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Message:
      type: object
      additionalProperties: false
      required: [id, sequence, role, content, workspace, createdAt]
      properties:
        id:
          type: string
          format: uuid
        sequence:
          type: integer
          format: int64
          minimum: 1
        role:
          type: string
          enum: [user, assistant, tool]
        content:
          type: string
        workspace:
          type: string
        model:
          type: [string, 'null']
        thinking:
          type: [string, 'null']
        toolCalls:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/MessageToolCall'
        toolCallId:
          type: [string, 'null']
        isError:
          type: boolean
        incomplete:
          type: boolean
        compactionId:
          type: [string, 'null']
          format: uuid
        createdAt:
          type: string
          format: date-time
    MessageToolCall:
      type: object
      additionalProperties: false
      required: [id, name, arguments]
      properties:
        id:
          type: string
        name:
          type: string
        arguments:
          type: object
          additionalProperties: true
    MessagePage:
      type: object
      additionalProperties: false
      required: [items, limit, offset, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 200
        offset:
          type: integer
          format: int32
          minimum: 0
        hasMore:
          type: boolean
    Session:
      type: object
      additionalProperties: false
      required:
        [id, createdAt, updatedAt, messageCount, completedTurnCount, activeTurn, agent, model, workspace]
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastMessageAt:
          type: [string, 'null']
          format: date-time
        messageCount:
          type: integer
          format: int64
          minimum: 0
        completedTurnCount:
          type: integer
          format: int64
          minimum: 0
        activeTurn:
          type: boolean
        agent:
          type: string
        model:
          type: string
        workspace:
          type: string
        executionProfile:
          type: string
          description: >
            The operator-defined profile this session's tools run under. Empty
            for a session recorded before profiles existed, which the
            controller reads as the deployment default.
    ExecutionProfile:
      type: object
      additionalProperties: false
      required:
        [name, kind, revision, allowDockerSocket, allowNetwork, allowPrivilegeEscalation, hostRootEquivalent]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [native, docker]
        revision:
          type: integer
          format: int64
          minimum: 0
        allowDockerSocket:
          type: boolean
        allowNetwork:
          type: boolean
        allowPrivilegeEscalation:
          type: boolean
        hostRootEquivalent:
          type: boolean
          description: >
            True when this profile grants access that is effectively host root,
            such as a writable Docker socket.
        capabilityWarning:
          type: string
          description: >
            Operator-facing warning for a host-root-equivalent profile. Empty
            for a profile that grants no such access.
    ExecutionProfileList:
      type: object
      additionalProperties: false
      required: [items, default]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExecutionProfile'
        default:
          type: string
          description: The profile a session opened without naming one uses.
    WorkerGeneration:
      type: object
      additionalProperties: false
      required: [id, sessionId, kind, profile, profileRevision, state, workspace, createdAt]
      properties:
        id:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [native, docker]
        profile:
          type: string
        profileRevision:
          type: integer
          format: int64
          minimum: 0
        state:
          type: string
          enum: [requested, starting, ready, stopping, stopped, failed]
        workspace:
          type: string
        containerId:
          type: string
          description: Set only for a Docker generation.
        imageDigest:
          type: string
          description: >
            Immutable image identity for a Docker generation, never a moving
            tag.
        failureDetail:
          type: string
          description: >
            Why a generation failed or was replaced. Never carries credentials.
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: [string, 'null']
          format: date-time
        endedAt:
          type: [string, 'null']
          format: date-time
    ReconfigureSessionRequest:
      type: object
      additionalProperties: false
      required: [profile, reason]
      properties:
        profile:
          type: string
          minLength: 1
          description: >
            The operator-defined profile to move this session to. An undefined
            name is refused. This is the only environment choice a client makes.
        reason:
          type: string
          minLength: 1
          description: >
            Why the profile changed, kept in the durable decision history.
    SessionProfileDecision:
      type: object
      additionalProperties: false
      required: [id, sessionId, toProfile, reason, decidedAt]
      properties:
        id:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        fromProfile:
          type: string
          description: >
            The profile the session ran under before this decision. Absent when
            the session had no recorded profile.
        toProfile:
          type: string
        reason:
          type: string
        decidedAt:
          type: string
          format: date-time
    SessionProfileDecisionPage:
      type: object
      additionalProperties: false
      required: [items, limit, offset, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SessionProfileDecision'
        limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 200
        offset:
          type: integer
          format: int32
          minimum: 0
        hasMore:
          type: boolean
    WorkerGenerationPage:
      type: object
      additionalProperties: false
      required: [items, limit, offset, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkerGeneration'
        limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 200
        offset:
          type: integer
          format: int32
          minimum: 0
        hasMore:
          type: boolean
    SessionPage:
      type: object
      additionalProperties: false
      required: [items, limit, offset, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Session'
        limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 200
        offset:
          type: integer
          format: int32
          minimum: 0
        hasMore:
          type: boolean
    OpenSessionRequest:
      type: object
      additionalProperties: false
      required: [workspace]
      properties:
        workspace:
          type: string
          minLength: 1
          description: >
            Absolute host path of the workspace directory. It is resolved
            through its symlinks and must fall under a configured workspace
            root.
        profile:
          type: string
          description: >
            Name of an operator-defined execution profile. Empty takes the
            deployment default. A name the operator did not define is refused
            with 403. This is the only environment choice a client makes: images,
            mounts, network, and capabilities come from deployment
            configuration alone. It applies only when this call creates the
            session; opening an existing session never changes its profile.
    OpenedSession:
      type: object
      additionalProperties: false
      required: [session, created]
      properties:
        session:
          $ref: '#/components/schemas/Session'
        created:
          type: boolean
          description: >
            True when this call created the session, false when it resumed an
            existing one.
    CancelResponse:
      type: object
      additionalProperties: false
      required: [cancelRequested]
      properties:
        cancelRequested:
          type: boolean
    Turn:
      type: object
      additionalProperties: false
      required:
        [id, sessionId, requestId, workspace, state, cancelRequested, startedAt,
         failureClassification]
      properties:
        id:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        requestId:
          type: string
          format: uuid
        workspace:
          type: string
        state:
          type: string
          enum: [running, completed, failed, cancelled, interrupted]
        cancelRequested:
          type: boolean
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: [string, 'null']
          format: date-time
        failureClassification:
          type: string
        contextSnapshotHash:
          type: [string, 'null']
        promptSnapshotHash:
          type: [string, 'null']
    TurnPage:
      type: object
      additionalProperties: false
      required: [turns, limit, offset, hasMore]
      properties:
        turns:
          type: array
          items:
            $ref: '#/components/schemas/Turn'
        limit:
          type: integer
          format: int32
        offset:
          type: integer
          format: int32
        hasMore:
          type: boolean
    TranscriptEvent:
      type: object
      additionalProperties: false
      required: [id, sessionId, turnId, sequence, requestId, type, payload, createdAt]
      properties:
        id:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        turnId:
          type: string
          format: uuid
        sequence:
          type: integer
          format: int64
        requestId:
          type: string
          format: uuid
        type:
          type: string
        payload:
          type: object
          additionalProperties: true
        parentToolCallId:
          type: [string, 'null']
        workerGenerationId:
          description: Worker generation that produced this event, if started.
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
    TranscriptEventPage:
      type: object
      additionalProperties: false
      required: [events, limit, offset, hasMore]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/TranscriptEvent'
        limit:
          type: integer
          format: int32
        offset:
          type: integer
          format: int32
        hasMore:
          type: boolean
    AgentRunMessage:
      type: object
      additionalProperties: false
      description: >-
        One prompt-visible record in a child agent run's own transcript. It
        carries no turn: a child belongs to its agent run, not to a session
        turn's message sequence.
      required:
        [id, sessionId, agentRunId, sequence, role, content, isError,
         incomplete, createdAt]
      properties:
        id:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        agentRunId:
          type: string
          format: uuid
        sequence:
          type: integer
          format: int64
        role:
          type: string
          enum: [user, assistant, tool]
        content:
          type: string
        model:
          type: string
        thinking:
          type: string
        toolCalls:
          type: array
          items:
            type: object
            additionalProperties: true
        toolCallId:
          type: string
        compactionId:
          type: [string, 'null']
          format: uuid
          description: >-
            The child compaction that directly covered this message, or null
            while it is still raw.
        isError:
          type: boolean
        incomplete:
          type: boolean
        createdAt:
          type: string
          format: date-time
    AgentRunMessagePage:
      type: object
      additionalProperties: false
      required: [messages, limit, offset, hasMore]
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/AgentRunMessage'
        limit:
          type: integer
          format: int32
        offset:
          type: integer
          format: int32
        hasMore:
          type: boolean
    AgentRunCompaction:
      type: object
      additionalProperties: false
      description: >-
        One immutable summary covering a completed prefix of one child agent
        run's transcript. directFromSequence and directToSequence name only the
        messages this row covered itself; fromSequence and toSequence span the
        whole superseded lineage.
      required:
        [id, sessionId, agentRunId, fromMessageId, toMessageId, fromSequence,
         toSequence, directFromSequence, directToSequence, summary,
         sourceMessageCount, inputTokenCount, summaryTokenCount, model,
         promptHash, createdAt]
      properties:
        id:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        agentRunId:
          type: string
          format: uuid
        fromMessageId:
          type: string
          format: uuid
        toMessageId:
          type: string
          format: uuid
        fromSequence:
          type: integer
          format: int64
        toSequence:
          type: integer
          format: int64
        directFromSequence:
          type: integer
          format: int64
        directToSequence:
          type: integer
          format: int64
        summary:
          type: string
        sourceMessageCount:
          type: integer
          format: int64
        inputTokenCount:
          type: integer
          format: int64
        summaryTokenCount:
          type: integer
          format: int64
        model:
          type: string
        promptHash:
          type: string
        createdAt:
          type: string
          format: date-time
        parentCompactionId:
          type: [string, 'null']
          format: uuid
          description: >-
            The direct predecessor this compaction supersedes, or null for the
            first compaction in the chain.
    AgentRunCompactionPage:
      type: object
      additionalProperties: false
      required: [compactions, limit, offset, hasMore]
      properties:
        compactions:
          type: array
          items:
            $ref: '#/components/schemas/AgentRunCompaction'
        limit:
          type: integer
          format: int32
        offset:
          type: integer
          format: int32
        hasMore:
          type: boolean
    Compaction:
      type: object
      additionalProperties: false
      required:
        [id, sessionId, fromMessageId, toMessageId, fromSequence, toSequence,
         summary, sourceMessageCount, inputTokenCount, summaryTokenCount, model,
         promptHash, createdAt]
      properties:
        id:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        fromMessageId:
          type: string
          format: uuid
        toMessageId:
          type: string
          format: uuid
        fromSequence:
          type: integer
          format: int64
        toSequence:
          type: integer
          format: int64
        summary:
          type: string
        sourceMessageCount:
          type: integer
          format: int64
        inputTokenCount:
          type: integer
          format: int64
        summaryTokenCount:
          type: integer
          format: int64
        model:
          type: string
        promptHash:
          type: string
        createdAt:
          type: string
          format: date-time
        parentCompactionId:
          type: [string, 'null']
          format: uuid
    CompactionPage:
      type: object
      additionalProperties: false
      required: [compactions, limit, offset, hasMore]
      properties:
        compactions:
          type: array
          items:
            $ref: '#/components/schemas/Compaction'
        limit:
          type: integer
          format: int32
        offset:
          type: integer
          format: int32
        hasMore:
          type: boolean
    ModelRun:
      type: object
      additionalProperties: false
      required:
        [id, sessionId, turnId, stage, modelReference, connectionName,
         requestedModelId, responseModelId, requestSettings, state,
         responseText, responseThinking, responseMessages, responseInjections,
         responseUsage, responseCostAmount, retryCostAmount, billedCostAmount,
         costKnown, finishReason, failureClassification, failureDetail,
         startedAt]
      properties:
        id:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        turnId:
          type: string
          format: uuid
        agentRunId:
          type: [string, 'null']
          format: uuid
        stage:
          type: string
          enum: [turn, child, compaction]
        modelReference:
          type: string
        connectionName:
          type: string
        requestedModelId:
          type: string
        responseModelId:
          type: string
        requestSettings:
          type: object
          additionalProperties: true
        state:
          type: string
          enum: [running, completed, failed, cancelled, interrupted]
        responseText:
          type: string
        responseThinking:
          type: string
        responseMessages:
          type: array
          items: {}
        responseInjections:
          type: array
          items: {}
        responseUsage:
          type: object
          additionalProperties: true
        responseCostAmount:
          type: string
        retryCostAmount:
          type: string
        billedCostAmount:
          type: string
        costKnown:
          type: boolean
        finishReason:
          type: string
        failureClassification:
          type: string
        failureDetail:
          type: string
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: [string, 'null']
          format: date-time
    ModelRunPage:
      type: object
      additionalProperties: false
      required: [modelRuns, limit, offset, hasMore]
      properties:
        modelRuns:
          type: array
          items:
            $ref: '#/components/schemas/ModelRun'
        limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 200
        offset:
          type: integer
          format: int32
          minimum: 0
        hasMore:
          type: boolean
    ModelCall:
      type: object
      additionalProperties: false
      required:
        [id, sessionId, modelRunId, round, requestMessages, requestTools,
         state, responseMessage, responseUsage, retryAttempts,
         retryAttemptCount, promptTokens, completionTokens, totalTokens,
         reasoningTokens, cacheReadTokens, cacheWriteTokens,
         cacheWriteLongTtlTokens, wastedPromptTokens, wastedCompletionTokens,
         wastedTotalTokens, totalAttempts, responseModelId, finishReason,
         responseCostAmount, retryCostAmount, billedCostAmount, costKnown,
         failureClassification, failureDetail, startedAt]
      properties:
        id:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        modelRunId:
          type: string
          format: uuid
        round:
          type: integer
          format: int64
          minimum: 0
        requestMessages:
          type: array
          items: {}
        requestTools:
          type: array
          items: {}
        state:
          type: string
          enum: [running, completed, failed, cancelled, interrupted]
        responseMessage:
          type: [object, 'null']
          additionalProperties: true
        responseUsage:
          type: object
          additionalProperties: true
        retryAttempts:
          type: array
          items:
            type: object
            additionalProperties: true
        retryAttemptCount:
          type: integer
          format: int64
          minimum: 0
        promptTokens:
          type: integer
          format: int64
          minimum: 0
        completionTokens:
          type: integer
          format: int64
          minimum: 0
        totalTokens:
          type: integer
          format: int64
          minimum: 0
        reasoningTokens:
          type: integer
          format: int64
          minimum: 0
        cacheReadTokens:
          type: integer
          format: int64
          minimum: 0
        cacheWriteTokens:
          type: integer
          format: int64
          minimum: 0
        cacheWriteLongTtlTokens:
          type: integer
          format: int64
          minimum: 0
        wastedPromptTokens:
          type: integer
          format: int64
          minimum: 0
        wastedCompletionTokens:
          type: integer
          format: int64
          minimum: 0
        wastedTotalTokens:
          type: integer
          format: int64
          minimum: 0
        totalAttempts:
          type: integer
          format: int64
          minimum: 0
        responseModelId:
          type: string
        finishReason:
          type: string
        responseCostAmount:
          type: string
        retryCostAmount:
          type: string
        billedCostAmount:
          type: string
        costKnown:
          type: boolean
        failureClassification:
          type: string
        failureDetail:
          type: string
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: [string, 'null']
          format: date-time
    ModelCallPage:
      type: object
      additionalProperties: false
      required: [modelRun, calls, limit, offset, hasMore]
      properties:
        modelRun:
          $ref: '#/components/schemas/ModelRun'
        calls:
          type: array
          items:
            $ref: '#/components/schemas/ModelCall'
        limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 200
        offset:
          type: integer
          format: int32
          minimum: 0
        hasMore:
          type: boolean
    ContextSnapshot:
      type: object
      additionalProperties: false
      required: [hash, manifest, resolvedContent, createdAt]
      properties:
        hash:
          type: string
        manifest:
          description: >
            The layered sources this context was assembled from, in resolution
            order. It is a list because the harness contributes one entry per
            file from the filesystem root down to the workspace, and the same
            name may appear at more than one layer.
          type: array
          items:
            $ref: '#/components/schemas/ContextManifestEntry'
        resolvedContent:
          type: string
        createdAt:
          type: string
          format: date-time
    ContextManifestEntry:
      type: object
      additionalProperties: false
      required: [kind, name, source, priority, hash]
      properties:
        kind:
          type: string
        name:
          type: string
        source:
          type: string
        priority:
          type: integer
          format: int32
        hash:
          type: string
    PromptSnapshot:
      type: object
      additionalProperties: false
      required: [hash, effectivePrompt, createdAt]
      properties:
        hash:
          type: string
        effectivePrompt:
          type: string
        createdAt:
          type: string
          format: date-time
    AgentRun:
      type: object
      additionalProperties: false
      required:
        [agentRunId, sessionId, parentTurnId, requestId, name, definition,
         depth, workspace, modelReference, model, task, instructions,
         allowedTools, systemPrompt, eventCount, cancelRequested, state,
         responseText, responseThinking, responseMessages, finishReason,
         promptTokenCount, completionTokenCount, failureClassification,
         failureDetail, startedAt]
      properties:
        agentRunId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        parentTurnId:
          type: string
          format: uuid
        parentAgentRunId:
          type: [string, 'null']
          format: uuid
        workerGenerationId:
          description: Worker generation that ran this child agent.
          type: [string, 'null']
        name:
          type: string
        definition:
          type: string
          enum: [stored, ad-hoc]
        parentToolCallId:
          type: [string, 'null']
        requestId:
          type: string
          format: uuid
        depth:
          type: integer
          format: int64
        workspace:
          type: string
        modelReference:
          type: string
        model:
          type: string
        task:
          type: string
        instructions:
          type: string
        allowedTools:
          type: array
          items: {}
        systemPrompt:
          type: string
        eventCount:
          type: integer
          format: int64
        cancelRequested:
          type: boolean
        state:
          type: string
          enum: [running, completed, failed, cancelled, interrupted]
        responseText:
          type: string
        responseThinking:
          type: string
        responseMessages:
          type: array
          items: {}
        finishReason:
          type: string
        promptTokenCount:
          type: integer
          format: int64
        completionTokenCount:
          type: integer
          format: int64
        failureClassification:
          type: string
        failureDetail:
          type: string
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: [string, 'null']
          format: date-time
    AgentRunPage:
      type: object
      additionalProperties: false
      required: [agents, limit, offset, hasMore]
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/AgentRun'
        limit:
          type: integer
          format: int32
        offset:
          type: integer
          format: int32
        hasMore:
          type: boolean
    AgentRunEvent:
      type: object
      additionalProperties: false
      required: [sequence, type, createdAt]
      properties:
        sequence:
          type: integer
          format: int64
        type:
          type: string
        payload:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    AgentRunEventPage:
      type: object
      additionalProperties: false
      required: [agentRunId, state, events, nextCursor, hasMore]
      properties:
        agentRunId:
          type: string
          format: uuid
        state:
          type: string
          enum: [running, completed, failed, cancelled, interrupted]
        events:
          type: array
          items:
            $ref: '#/components/schemas/AgentRunEvent'
        nextCursor:
          description: Pass back as cursor to continue from here.
          type: integer
          format: int64
        hasMore:
          type: boolean
    AgentRunCancelResponse:
      type: object
      additionalProperties: false
      required: [agentRunId, cancelRequested, state]
      properties:
        agentRunId:
          type: string
          format: uuid
        cancelRequested:
          description: >-
            True when this request found a running agent and signalled it.
            Cancelling an unknown, completed, or already cancelled run is not
            an error and reports false with the current state.
          type: boolean
        state:
          type: string
          enum: [running, completed, failed, cancelled, interrupted]
    Job:
      type: object
      additionalProperties: false
      required:
        [jobId, sessionId, turnId, pid, purpose, command, directory, state,
         startedAt, exitCode, failureDetail]
      properties:
        jobId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        turnId:
          description: The durable turn that launched this process.
          type: string
          format: uuid
        pid:
          description: Operating-system process ID of the job's shell.
          type: integer
          format: int64
        purpose:
          description: Why the agent said it was running this command.
          type: string
        command:
          type: string
        directory:
          type: string
        toolCallId:
          description: The tool call that started this job.
          type: string
        workerGenerationId:
          description: Worker generation that launched this process.
          type: [string, 'null']
        state:
          type: string
          enum: [running, exited, signalled, failed, interrupted]
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        exitCode:
          description: Exit status once known, or -1 while it is not.
          type: integer
          format: int64
        failureDetail:
          description: Empty unless Peen recorded a terminal failure detail.
          type: string
    JobPage:
      type: object
      additionalProperties: false
      required: [jobs, limit, offset, hasMore]
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/Job'
        limit:
          type: integer
          format: int32
        offset:
          type: integer
          format: int32
        hasMore:
          type: boolean
    JobOutputLine:
      type: object
      additionalProperties: false
      required: [id, sessionId, jobId, sequence, stream, content, createdAt]
      properties:
        id:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
        sequence:
          type: integer
          format: int64
        stream:
          type: string
          enum: [stdout, stderr]
        content:
          type: string
        createdAt:
          type: string
          format: date-time
    JobOutput:
      type: object
      additionalProperties: false
      required: [jobId, state, lines, nextCursor, hasMore]
      properties:
        jobId:
          type: string
          format: uuid
        state:
          type: string
          enum: [running, exited, signalled, failed, interrupted]
        lines:
          description: Ordered immutable stdout and stderr records from SQLite.
          type: array
          items:
            $ref: '#/components/schemas/JobOutputLine'
        nextCursor:
          description: Pass back as cursor to continue from this durable sequence.
          type: integer
          format: int64
        hasMore:
          type: boolean
    JobSignalRequest:
      type: object
      additionalProperties: false
      required: [signal]
      properties:
        signal:
          description: >-
            stop sends SIGTERM to the process group then escalates to SIGKILL.
            kill goes straight to SIGKILL.
          type: string
          enum: [stop, kill]
    JobSignalRecord:
      type: object
      additionalProperties: false
      required: [id, sessionId, jobId, signal, accepted, stateAtRequest, requestedAt]
      properties:
        id:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
        signal:
          type: string
          enum: [stop, kill]
        accepted:
          type: boolean
        stateAtRequest:
          type: string
          enum: [running, exited, signalled, failed, interrupted]
        requestedAt:
          type: string
          format: date-time
    JobSignalRecordPage:
      type: object
      additionalProperties: false
      required: [job, signalRequests, limit, offset, hasMore]
      properties:
        job:
          $ref: '#/components/schemas/Job'
        signalRequests:
          type: array
          items:
            $ref: '#/components/schemas/JobSignalRecord'
        limit:
          type: integer
          format: int32
        offset:
          type: integer
          format: int32
        hasMore:
          type: boolean
    JobSignalResponse:
      type: object
      additionalProperties: false
      required: [jobId, signalled, state]
      properties:
        jobId:
          type: string
          format: uuid
        signalled:
          description: >-
            True when this request found a running job and signalled it.
            Signalling an unknown, exited, or already signalled job is not an
            error and reports false with the current state.
          type: boolean
        state:
          type: string
          enum: [running, exited, signalled, failed, interrupted]
    SessionNoticeRequest:
      type: object
      additionalProperties: false
      required: [type, summary]
      properties:
        type:
          description: >-
            Dotted lowercase namespaced type. The job. and agent. prefixes are
            reserved for Peen's own producers and are rejected here.
          type: string
          minLength: 1
          maxLength: 128
        summary:
          description: The one line describing what happened.
          type: string
          minLength: 1
        data:
          description: Structured payload for programmatic consumers.
          type: object
          additionalProperties: true
        delivery:
          description: >-
            queue waits for the next turn. wake starts a turn when the session
            is idle and .agents/events declares a handler for this type.
          type: string
          enum: [queue, wake]
          default: queue
    SessionNotice:
      type: object
      additionalProperties: false
      required: [id, type, source, summary, delivery, createdAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        source:
          type: string
        summary:
          type: string
        data:
          type: object
          additionalProperties: true
        delivery:
          type: string
          enum: [queue, wake]
        createdAt:
          type: string
          format: date-time
    SessionNoticePage:
      type: object
      additionalProperties: false
      required: [notices, limit, offset, hasMore]
      properties:
        notices:
          type: array
          items:
            $ref: '#/components/schemas/SessionNotice'
        limit:
          type: integer
          format: int32
        offset:
          type: integer
          format: int32
        hasMore:
          type: boolean
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
