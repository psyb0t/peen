title: Peen
tagline: Coding agent server documentation
description: Peen is a self-hosted coding agent built as a server. It runs each project in its own process or container, and every tool call and model exchange lands in SQLite.
lang: en
url: https://psyb0t.github.io
baseurl: /peen
repository: psyb0t/peen
author: Ciprian Mandache

remote_theme: just-the-docs/just-the-docs@v0.12.0
color_scheme: peen

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links
  - jekyll-include-cache

permalink: pretty

relative_links:
  enabled: true
  collections: false

defaults:
  - scope:
      path: ""
    values:
      layout: default
      seo:
        type: TechArticle

search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false
  focus_shortcut_key: k

heading_anchors: true
back_to_top: true
back_to_top_text: Back to top

aux_links:
  GitHub:
    - https://github.com/psyb0t/peen
aux_links_new_tab: true

nav_external_links:
  - title: Changelog
    url: https://github.com/psyb0t/peen/blob/main/CHANGELOG.md
    hide_icon: false
  - title: Releases
    url: https://github.com/psyb0t/peen/releases
    hide_icon: false

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/psyb0t/peen
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: tree
